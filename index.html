                     { duration: 4500, delay, easing: 'ease-out', fill: 'both' })
            .finished.then(() => wash.remove(), () => wash.remove());
        setTimeout(() => card.classList.add('fx-shine'), delay + 150);
        setTimeout(() => card.classList.remove('fx-shine'), delay + 2200);
      });

      for (const stack of moving) stack.classList.add('is-moving');
      await new Promise(r => setTimeout(r, startDelay + Math.max(0, landing.length - 1) * step + 900));
      for (const stack of moving) stack.classList.remove('is-moving');
    }

    /* ── Breaking takeover (Simple layout, Takeover switched on) ──
       Dims the screen and shows the newest arrivals (up to three) large in
       the middle, newest on top, coming in from the bottom up, with a bar
       that empties to show how long they'll stay. Resolves when it's time
       to leave; close() then fades the big cards out, drifting a little
       towards their places, while the real cards land underneath. Nothing
       is stretched or squashed, so text never distorts. */
    function takeoverWanted() {
      return displayMode && displayLayout === 'simple' && document.getElementById('takeover-check').checked;
    }

    async function showTakeover(arrivals) {
      const shown = arrivals.slice(0, 3);
      const dim = make('div', 'takeover-dim');
      const box = make('div', 'takeover' + (shown.length > 1 ? ' is-multi' : '') + (shown.length > 2 ? ' is-many' : ''));
      box.setAttribute('aria-hidden', 'true');
      const kicker = make('div', 'takeover-kicker',
        arrivals.length === 1 ? 'Just in' :
        arrivals.length > shown.length ? `${arrivals.length} new alerts · latest ${shown.length}` :
        `${arrivals.length} new alerts`);
      const cards = shown.map(item => {
        const t = make('article', 'tcard');
        t.dataset.id = item.id;
        t.style.setProperty('--brand', brandColour(item.app));
        const row = make('div', 'tcard-row');
        row.append(buildIcon(item), make('span', '', item.byline || item.app), make('span', 'when', notificationTime(item.time)));
        t.append(row, make('h2', '', item.headline), make('div', 'pushed', 'Pushed at ' + clockTime(item.time, true)));
        return t;
      });
      const timer = make('div', 'takeover-timer');
      const fill = make('span');
      timer.append(fill);
      box.append(kicker, ...cards, timer);
      document.body.append(dim, box);

      // Shrink the whole stack evenly if long headlines make it too tall.
      const room = innerHeight * 0.9;
      const tall = [...box.children].reduce((h, c) => h + c.getBoundingClientRect().height, 0) +
                   (box.children.length - 1) * parseFloat(getComputedStyle(box).rowGap || 0);
      if (tall > room) box.style.transform = `scale(${(room / tall).toFixed(3)})`;

      const ease = 'cubic-bezier(.2, .9, .3, 1.05)';
      dim.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 450, easing: 'ease-out', fill: 'both' });
      kicker.animate([{ opacity: 0, transform: 'translateY(0.6rem)' }, { opacity: 1, transform: 'none' }],
                     { duration: 500, delay: 100, easing: ease, fill: 'backwards' });
      [...cards].reverse().forEach((t, i) => t.animate(
        [{ opacity: 0, transform: 'translateY(2.2rem) scale(0.96)' }, { opacity: 1, transform: 'none' }],
        { duration: 650, delay: 180 + i * 220, easing: ease, fill: 'backwards' }));
      const entrance = 180 + (cards.length - 1) * 220 + 650;
      const hold = (CONFIG.TAKEOVER_SECONDS + (shown.length - 1) * CONFIG.TAKEOVER_EXTRA_SECONDS) * 1000;
      timer.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400, delay: entrance - 300, fill: 'backwards' });
      fill.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }], { duration: hold, delay: entrance, easing: 'linear', fill: 'both' });
      await new Promise(r => setTimeout(r, entrance + hold));

      return {
        async close() {
          const out = { duration: 520, easing: 'cubic-bezier(.4, 0, .6, 1)', fill: 'forwards' };
          for (const t of cards) {
            const from = t.getBoundingClientRect();
            const target = el.feed.querySelector(`.stack[data-id="${CSS.escape(t.dataset.id)}"]`);
            const to = target ? target.getBoundingClientRect() : null;
            const dx = to ? (to.left + to.width / 2 - (from.left + from.width / 2)) * 0.33 : 0;
            const dy = to ? (to.top + to.height / 2 - (from.top + from.height / 2)) * 0.33 : 30;
            t.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translate(${dx}px, ${dy}px) scale(0.9)` }], out);
          }
          for (const part of [kicker, timer]) part.animate([{ opacity: 1 }, { opacity: 0 }], out);
          await dim.animate([{ opacity: 1 }, { opacity: 0 }], { ...out, duration: 600 }).finished;
          dim.remove();
          box.remove();
        },
      };
    }

    function setDisplayLayout(layout) {
      displayLayout = layout === 'hero' ? 'hero' : 'simple';
      for (const button of document.querySelectorAll('#mode-toggle button')) {
        button.setAttribute('aria-pressed', String(button.dataset.layout === displayLayout));
      }
      document.getElementById('takeover-toggle').hidden = displayLayout !== 'simple';
      // Remember it in the address (so a bookmark opens the same way) and
      // in this browser.
      history.replaceState(null, '', '?display=' + displayLayout);
      try { localStorage.setItem('pushFeedDisplay', displayLayout); } catch (e) { /* fine */ }
      render();
    }

    // Builds one iOS-style notification:
    //   [icon]  Title (alert title, author, or the app's name)     12m ago
    //           The alert text, cut to four lines until tapped
    // Hidden repeats show as a stacked card underneath plus a red badge.
    function buildCard(item) {
      const stack = make('div', 'stack' +
        (item.repeats.length ? ' has-repeats' : '') +
        (item.isNew ? ' is-new' : ''));
      stack.dataset.id = item.id;
      stack.dataset.app = item.app.toLowerCase();
      stack.dataset.time = item.time;
      const card = make('article', 'card' + (expandedIds.has(item.id) ? ' is-expanded' : ''));

      // Tap to show the whole alert, tap again to cut it back to four lines.
      card.addEventListener('click', event => {
        if (event.target.closest('.when')) return; // that tap is for the exact time
        card.classList.toggle('is-expanded');
        if (card.classList.contains('is-expanded')) expandedIds.add(item.id);
        else expandedIds.delete(item.id);
      });

      card.append(buildIcon(item), make('div', 'card-body'));
      const body = card.lastChild;

      // The time ("12m ago"), which expands to the exact moment on hover
      // (or tap / keyboard focus, so it works on phones too). tickClock()
      // keeps it current, finding it by its data-time attribute.
      const when = make('time', 'when', notificationTime(item.time));
      when.dateTime = new Date(item.time).toISOString();
      when.dataset.time = item.time;
      when.dataset.full = fullTime(item);
      when.tabIndex = 0;
      when.setAttribute('aria-label', when.dataset.full);

      const top = make('div', 'card-top');
      top.append(make('span', 'title', item.byline || item.app), when);

      body.append(top, make('p', 'headline', item.headline));
      stack.append(card);
      return stack;
    }

    // The app's icon if we have one, otherwise its initials on a steady
    // colour. The badge counts this alert plus its hidden repeats, the way
    // iOS counts a stack.
    function buildIcon(item) {
      const box = make('div', 'icon');
      const src = CONFIG.ICONS[item.app.toLowerCase()];
      let img;
      if (src) {
        img = make('img');
        img.src = src;
        img.alt = item.app;
        img.width = img.height = 38;
        img.decoding = 'async';
        // A missing file falls back to initials rather than a broken image.
        img.addEventListener('error', () => img.replaceWith(initialsTile(item)), { once: true });
      }
      box.append(img || initialsTile(item));
      if (item.repeats.length) box.append(make('span', 'badge', String(item.repeats.length + 1)));
      return box;
    }

    function initialsTile(item) {
      const tile = make('span', 'initials', initials(item.app));
      tile.style.background = colourFor(item.pkg || item.app);
      tile.setAttribute('role', 'img');
      tile.setAttribute('aria-label', item.app);
      return tile;
    }

    // Small helper: create an element with a class and some text.
    function make(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    // The alerts belonging to the tab that's showing.
    function tabItems() {
      return items.filter(item => item.side === onSideTab);
    }

    // Labels the tabs with counts, e.g. "News 142" / "AT Mobile 8", and
    // marks the selected one.
    function updateTabs() {
      if (!CONFIG.SIDE_TAB) { el.tabs.hidden = true; return; }
      const sideCount = items.filter(item => item.side).length;
      const label = (button, text, n) => {
        button.replaceChildren(text, make('span', 'count', String(n)));
      };
      label(el.tabNews, 'News', items.length - sideCount);
      label(el.tabSide, CONFIG.SIDE_TAB.label, sideCount);
      el.tabNews.setAttribute('aria-selected', String(!onSideTab));
      el.tabSide.setAttribute('aria-selected', String(onSideTab));
    }

    function switchTab(side) {
      if (side === onSideTab) return;
      onSideTab = side;
      history.replaceState(null, '', side ? '#side' : location.pathname + location.search);
      updateTabs();
      updateAppFilter();
      render();
    }

    // Fills the publisher dropdown with every app on this tab, plus counts,
    // e.g. "RNZ (12)". Keeps whatever the visitor had selected.
    function updateAppFilter() {
      const counts = new Map();
      for (const item of tabItems()) counts.set(item.app, (counts.get(item.app) || 0) + 1);

      const chosen = el.appFilter.value;
      const names = [...counts.keys()].sort((a, b) => a.localeCompare(b));

      el.appFilter.replaceChildren(new Option('All apps', ''));
      for (const name of names) el.appFilter.append(new Option(`${name} (${counts.get(name)})`, name));

      // If their chosen publisher has dropped out of the latest 150, reset.
      el.appFilter.value = counts.has(chosen) ? chosen : '';
    }

    /* ════════════════════════════════════════════════════════════════════
       STEP 6 — THE STATUS LINE
         green  ● Last alert 3 min ago      everything's flowing
         amber  ● Quiet for 4 h             no alerts for a while (normal overnight)
         red    ● Can't reach the feed      download failed; showing older data
       ════════════════════════════════════════════════════════════════════ */
    function updateStatus() {
      const newest = items.length ? items[0].time : null;
      let state, text;

      if (lastCheckOk === false) {
        state = 'is-bad';
        text = items.length ? 'Can’t reach the feed · showing older alerts' : 'Can’t reach the feed';
      } else if (!newest) {
        state = '';
        text = 'Waiting for the first alert';
      } else if (Date.now() - newest > CONFIG.QUIET_AFTER_MINUTES * 60000) {
        state = 'is-warn';
        text = 'Quiet for ' + timeAgo(newest).replace(' ago', '');
      } else {
        state = 'is-ok';
        text = 'Last alert ' + timeAgo(newest);
      }

      el.statusDot.className = 'dot ' + state;
      // The display-mode LIVE bug follows the same health.
      el.liveBug.dataset.state = state;
      el.liveLabel.textContent = state === 'is-warn' ? 'Quiet' : state === 'is-bad' ? 'Offline' : 'Live';
      el.statusText.textContent = text;
      // Hovering the status shows exactly when we last checked.
      el.statusText.title = lastCheckedAt ? 'Checked at ' + clockTime(lastCheckedAt, true) : '';
    }

    // Every 30 seconds, update the "12m ago" labels and the status line
    // without downloading anything.
    function tickClock() {
      for (const node of el.feed.querySelectorAll('.when')) {
        node.textContent = notificationTime(Number(node.dataset.time));
      }
      updateStatus();
    }

    /* ════════════════════════════════════════════════════════════════════
       TIME HELPERS
       ════════════════════════════════════════════════════════════════════ */
    // "just now", "3m ago", "2h ago", "4d ago" (for the status line)
    function timeAgo(ms) {
      const s = Math.max(0, (Date.now() - ms) / 1000);
      if (s < 60)    return 'just now';
      if (s < 3600)  return Math.floor(s / 60) + 'm ago';   // rounds down, like the cards
      if (s < 86400) return Math.floor(s / 3600) + 'h ago';
      return Math.floor(s / 86400) + 'd ago';
    }

    // Formatting options that respect CONFIG.TIME_ZONE.
    const tz = CONFIG.TIME_ZONE ? { timeZone: CONFIG.TIME_ZONE } : {};

    // A notification's time, the way iOS writes it:
    //   now · 12m ago · 2h ago · then the clock time, e.g. 14:43
    // (The day heading above the card already says which day.)
    const hhmm = new Intl.DateTimeFormat('en-NZ', { ...tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
    function notificationTime(ms) {
      const mins = Math.floor(Math.max(0, Date.now() - ms) / 60000);
      if (mins < 1)  return 'now';
      if (mins < 60) return mins + 'm ago';
      if (mins < 4 * 60) return Math.floor(mins / 60) + 'h ago';
      return hhmm.format(ms);
    }

    // "8:32 am" (or "8:32:40 am" with seconds)
    function clockTime(ms, withSeconds) {
      return new Date(ms).toLocaleTimeString(undefined, {
        ...tz, hour: 'numeric', minute: '2-digit', ...(withSeconds ? { second: '2-digit' } : {}),
      });
    }

    // The hover text for a card, for comparing who pushed first:
    //   NZ Herald
    //   Mon 19 Oct 2026, 8:32:13.482 am NZDT
    //   Repeated 2× (last at 8:35:01 am)
    // (en-NZ so the zone reads "NZDT" rather than "GMT+13".)
    const fullFormat = new Intl.DateTimeFormat('en-NZ', {
      ...tz, weekday: 'short', day: 'numeric', month: 'short', year: 'numeric',
      hour: 'numeric', minute: '2-digit', second: '2-digit',
      fractionalSecondDigits: 3, timeZoneName: 'short',
    });
    function fullTime(item) {
      let s = item.app + '\n' + fullFormat.format(item.time);
      if (item.repeats.length) {
        const last = item.repeats[item.repeats.length - 1];
        s += `\nRepeated ${item.repeats.length}× (last at ${clockTime(last, true)}), hidden`;
      }
      return s;
    }

    // "2026-10-19": which calendar day a moment falls on, in the chosen time
    // zone. Used to group cards under day headings.
    const dayKeyFormat = new Intl.DateTimeFormat('en-CA', { ...tz, year: 'numeric', month: '2-digit', day: '2-digit' });
    function dayKey(ms) { return dayKeyFormat.format(ms); }

    // "Today", "Yesterday", or "Sat 17 Oct"
    function dayLabel(ms) {
      const key = dayKey(ms);
      if (key === dayKey(Date.now())) return 'Today';
      if (key === dayKey(Date.now() - 86400000)) return 'Yesterday';
      return new Date(ms).toLocaleDateString(undefined, { ...tz, weekday: 'short', day: 'numeric', month: 'short' });
    }

    /* ════════════════════════════════════════════════════════════════════
       LOOK HELPERS
       ════════════════════════════════════════════════════════════════════ */
    // "NZ Herald" → "NH", "RNZ" → "R", "1News" → "1"
    function initials(name) {
      return name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
    }

    // Gives each app its own steady colour: the app's name is turned into a
    // number, and that number picks a hue on the colour wheel. Same app →
    // same colour, every visit, with no list to maintain.
    function colourFor(key) {
      let hash = 0;
      for (const ch of key) hash = (hash * 31 + ch.codePointAt(0)) >>> 0;
      return `hsl(${hash % 360} 52% 42%)`;
    }

    /* ════════════════════════════════════════════════════════════════════
       WALLPAPER SLIDESHOW
       When switched on, every SLIDESHOW_SECONDS a different random
       wallpaper is downloaded, put on the hidden layer and faded in. It
       pauses while the tab is hidden, and the on/off choice is saved in
       this browser only (if the browser allows saving).
       ════════════════════════════════════════════════════════════════════ */
    const slideshow = {
      walls: window.PUSH_FEED_WALLPAPERS || { folder: '', list: [], current: '' },
      layers: [document.getElementById('wall-a'), document.getElementById('wall-b')],
      showing: 0,          // which layer is currently visible
      timer: null,
      button: document.getElementById('slideshow-toggle'),
      check: document.getElementById('fade-check'),   // the display-mode switch
    };
    document.documentElement.style.setProperty('--wall-fade', CONFIG.SLIDESHOW_FADE_SECONDS + 's');

    function slideshowOn() { return slideshow.button.getAttribute('aria-pressed') === 'true'; }

    function setSlideshow(on) {
      slideshow.button.setAttribute('aria-pressed', String(on));
      slideshow.check.checked = on;
      try { localStorage.setItem('pushFeedSlideshow', on ? 'on' : 'off'); } catch (e) { /* not saved; fine */ }
      scheduleWallpaper();
    }

    function scheduleWallpaper() {
      clearTimeout(slideshow.timer);
      if (!slideshowOn() || document.hidden || slideshow.walls.list.length < 2) return;
      slideshow.timer = setTimeout(nextWallpaper, CONFIG.SLIDESHOW_SECONDS * 1000);
    }

    function nextWallpaper() {
      const others = slideshow.walls.list.filter(name => name !== slideshow.walls.current);
      const name = others[Math.floor(Math.random() * others.length)];
      const url = slideshow.walls.folder + name;

      // Download it first, so the fade never shows a half-loaded image.
      const img = new Image();
      img.onload = () => {
        const incoming = slideshow.layers[1 - slideshow.showing];
        const outgoing = slideshow.layers[slideshow.showing];
        incoming.style.backgroundImage = `url("${url}")`;
        incoming.classList.add('is-showing');
        outgoing.classList.remove('is-showing');
        slideshow.showing = 1 - slideshow.showing;
        slideshow.walls.current = name;
        scheduleWallpaper();
      };
      img.onerror = scheduleWallpaper; // skip a missing file, try another next time
      img.src = url;
    }

    slideshow.button.addEventListener('click', () => setSlideshow(!slideshowOn()));
    slideshow.check.addEventListener('change', () => setSlideshow(slideshow.check.checked));
    document.addEventListener('visibilitychange', scheduleWallpaper);
    try { if (localStorage.getItem('pushFeedSlideshow') === 'on') setSlideshow(true); } catch (e) { /* ignore */ }

    /* ════════════════════════════════════════════════════════════════════
       START
       ════════════════════════════════════════════════════════════════════ */
    // Re-draw as the visitor types or picks a publisher (no download needed).
    el.search.addEventListener('input', render);
    el.appFilter.addEventListener('change', render);
    el.tabNews.addEventListener('click', () => switchTab(false));
    el.tabSide.addEventListener('click', () => switchTab(true));

    // Give the toolbar its frosted backing only while it's pinned to the
    // top: an invisible marker just above it scrolls out of view exactly then.
    new IntersectionObserver(([entry]) => {
      document.getElementById('toolbar').classList.toggle('is-stuck', !entry.isIntersecting);
    }).observe(document.getElementById('toolbar-sentinel'));
    window.addEventListener('hashchange', () => switchTab(!!CONFIG.SIDE_TAB && location.hash === '#side'));

    if (!CONFIG.SIDE_TAB) onSideTab = false;
    updateTabs();

    if (displayMode) {
      onSideTab = false;
      for (const button of document.querySelectorAll('#mode-toggle button')) {
        button.addEventListener('click', () => setDisplayLayout(button.dataset.layout));
      }
      // ?display=hero picks the layout; plain ?display uses the last one
      // chosen on this screen.
      let saved = null;
      try { saved = localStorage.getItem('pushFeedDisplay'); } catch (e) { /* fine */ }

      // Takeover (Simple layout): on if the address has &takeover, otherwise
      // whatever was last chosen on this screen.
      const takeoverCheck = document.getElementById('takeover-check');
      let savedTakeover = null;
      try { savedTakeover = localStorage.getItem('pushFeedTakeover'); } catch (e) { /* fine */ }
      const takeoverParam = new URLSearchParams(location.search).has('takeover');
      takeoverCheck.checked = takeoverParam || savedTakeover === 'on';
      // The address is tidied to ?display=… below, so remember a &takeover
      // choice or a reload would lose it.
      if (takeoverParam) { try { localStorage.setItem('pushFeedTakeover', 'on'); } catch (e) { /* fine */ } }
      takeoverCheck.addEventListener('change', () => {
        try { localStorage.setItem('pushFeedTakeover', takeoverCheck.checked ? 'on' : 'off'); } catch (e) { /* fine */ }
      });

      // Fade (wallpaper slideshow): &fade in the address switches it on and,
      // like the round button, it's remembered on this screen.
      if (new URLSearchParams(location.search).has('fade')) setSlideshow(true);

      setDisplayLayout(new URLSearchParams(location.search).get('display') || saved || 'simple');

      // Card heights change when the web fonts finish loading or the screen
      // size changes, so re-check what fits then.
      if (document.fonts) document.fonts.ready.then(render);
      tickDisplayClock();
      window.addEventListener('resize', render);

      // Hide the mouse pointer after 3 still seconds; moving it brings it back.
      let cursorTimer;
      const showCursor = () => {
        document.body.classList.remove('hide-cursor');
        clearTimeout(cursorTimer);
        cursorTimer = setTimeout(() => document.body.classList.add('hide-cursor'), 3000);
      };
      document.addEventListener('mousemove', showCursor);
      showCursor();
    }

    setInterval(tickClock, 30000);
    refresh(); // first download straight away
  })();
  </script>
</body>
</html>
