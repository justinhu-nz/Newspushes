    .skin-webos:not(.display-mode) .toolbar.is-stuck .wrap {
      border-radius: 0 0 18px 18px;
      border-top: 0;
      padding-top: 10px;
    }

    /* Glossy pill segmented tabs inside the Card View */
    .skin-webos:not(.display-mode) .tabs {
      padding: 2px;
      margin-bottom: 8px;
      border-radius: 999px;
      background: rgba(8, 10, 14, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.18);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.72);
    }
    .skin-webos:not(.display-mode) .tabs button {
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      color: rgba(235, 240, 248, 0.8);
      text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.65);
    }
    .skin-webos:not(.display-mode) .tabs button[aria-selected="true"] {
      color: #ffffff;
      background: linear-gradient(180deg, rgba(114, 122, 134, 0.92), rgba(58, 63, 72, 0.95));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.42), 0 1px 3px rgba(0, 0, 0, 0.55);
    }
    .skin-webos:not(.display-mode) .tabs .count { color: inherit; opacity: 0.78; font-weight: 600; }

    /* Recessed glossy search & filter controls */
    .skin-webos:not(.display-mode) .controls input,
    .skin-webos:not(.display-mode) .controls select {
      height: 32px;
      border-radius: 999px;
      background-color: rgba(10, 12, 16, 0.64);
      border: 1px solid rgba(255, 255, 255, 0.2);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.7);
      color: #ffffff;
      font-size: 13.5px;
    }
    .skin-webos:not(.display-mode) .controls input { padding: 0 12px 0 34px; }
    .skin-webos:not(.display-mode) .controls input::placeholder { color: rgba(226, 232, 242, 0.74); }
    .skin-webos:not(.display-mode) .controls select { padding: 0 28px 0 12px; font-weight: 600; }
    .skin-webos:not(.display-mode) .controls select option { background: #1e2126; color: #f4f7fb; }
    .skin-webos:not(.display-mode) .controls input:focus,
    .skin-webos:not(.display-mode) .controls select:focus {
      outline: none;
      border-color: #62d7f0;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(98, 215, 240, 0.3);
    }

    /* Notifications sit directly on pure #000 black under the rounded card */
    .skin-webos:not(.display-mode) main.wrap {
      padding-top: 2px;
      padding-bottom: 44px;
      background: transparent;
      border: 0;
      box-shadow: none;
    }
    .skin-webos:not(.display-mode) .day-heading {
      margin: 12px 4px 5px;
      font-family: var(--font);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6e7480;
      text-shadow: none;
    }
    .skin-webos:not(.display-mode) main > .day-heading:first-child { margin-top: 2px; }

    /* Tight 3px pure black gap between stacked Palm Pre notification pills */
    .skin-webos:not(.display-mode) .stack,
    .skin-webos:not(.display-mode) .stack.has-repeats { margin-bottom: 3px; }
    .skin-webos:not(.display-mode) .stack.has-repeats::after { display: none; }
    .skin-webos:not(.display-mode) .stack.is-new { animation: webos-arrive 0.34s cubic-bezier(0.2, 0.9, 0.25, 1); }
    @keyframes webos-arrive {
      from { opacity: 0; transform: translateY(-6px) scale(0.985); }
      to   { opacity: 1; transform: none; }
    }

    .skin-webos:not(.display-mode) .w-row {
      position: relative;
      cursor: pointer;
    }
    .skin-webos:not(.display-mode) .w-row:hover,
    .skin-webos:not(.display-mode) .w-row:focus-within { z-index: 2; }

    /* Authentic Palm Pre dark charcoal satin pill surface (high-res Pre reference) */
    .skin-webos:not(.display-mode) .w-row.is-single {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 54px;
      padding: 6px 12px 6px 8px;
      border-radius: 13px;
      background: linear-gradient(180deg, #3f4145 0%, #2d2f33 48%, #232528 100%);
      border: 1px solid #121315;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.24),
        inset 0 0 0 1px rgba(255, 255, 255, 0.04),
        inset 0 -1px 0 rgba(0, 0, 0, 0.6);
    }
    .skin-webos:not(.display-mode) .w-row.is-single.l-open {
      align-items: flex-start;
      padding-top: 8px;
      padding-bottom: 10px;
      background: linear-gradient(180deg, #494d54 0%, #34373d 48%, #292b30 100%);
      box-shadow:
        inset 0 1px 0 rgba(164, 200, 226, 0.42),
        inset 0 0 0 1px rgba(138, 176, 203, 0.22);
    }

    /* Grouped alert (repeats > 0): separate 54px left icon tile + 3px black gap + right text pill */
    .skin-webos:not(.display-mode) .w-row.is-split {
      display: flex;
      align-items: stretch;
      gap: 3px;
    }
    .skin-webos:not(.display-mode) .w-icon-pill,
    .skin-webos:not(.display-mode) .w-text-pill {
      border-radius: 13px;
      background: linear-gradient(180deg, #3f4145 0%, #2d2f33 48%, #232528 100%);
      border: 1px solid #121315;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.24),
        inset 0 0 0 1px rgba(255, 255, 255, 0.04),
        inset 0 -1px 0 rgba(0, 0, 0, 0.6);
    }
    .skin-webos:not(.display-mode) .w-icon-pill {
      position: relative;
      flex: none;
      width: 54px;
      min-height: 54px;
      display: grid;
      place-items: center;
    }
    .skin-webos:not(.display-mode) .w-text-pill {
      flex: 1;
      min-width: 0;
      padding: 6px 12px 7px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .skin-webos:not(.display-mode) .w-row.is-split.l-open .w-icon-pill,
    .skin-webos:not(.display-mode) .w-row.is-split.l-open .w-text-pill {
      background: linear-gradient(180deg, #505660 0%, #3a3f47 46%, #2d3138 100%);
      box-shadow:
        inset 0 1px 0 rgba(120, 224, 248, 0.42),
        inset 0 0 0 1px rgba(98, 215, 240, 0.22);
    }
    .skin-webos:not(.display-mode) .w-row.is-split.l-open .w-text-pill {
      padding-top: 8px;
      padding-bottom: 10px;
    }

    /* Chunky 3D-lit glossy Palm Pre publisher pebbles (40×40, fills pill height) */
    .skin-webos:not(.display-mode) .w-icon-pebble {
      position: relative;
      flex: none;
      width: 40px;
      height: 40px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: var(--w-pebble, linear-gradient(180deg, #58606d, #2b3038));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.62),
        inset 0 -2px 3px rgba(0, 0, 0, 0.42),
        0 2px 5px rgba(0, 0, 0, 0.68);
      overflow: hidden;
    }
    /* Curved 2009 webOS top glass dome highlight */
    .skin-webos:not(.display-mode) .w-icon-pebble::after {
      content: '';
      position: absolute;
      inset: 0 0 46% 0;
      border-radius: 10px 10px 45% 45% / 10px 10px 28% 28%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.56) 0%, rgba(255, 255, 255, 0.14) 100%);
      pointer-events: none;
    }
    .skin-webos:not(.display-mode) .w-icon-pebble.is-orb { border-radius: 50%; }
    .skin-webos:not(.display-mode) .w-icon-pebble.is-orb::after {
      inset: 1px 4px 48% 4px;
      border-radius: 50%;
    }
    .skin-webos:not(.display-mode) .w-icon-pebble .w-glyph-mask {
      position: relative;
      z-index: 1;
      width: var(--w-size, 23px);
      height: var(--w-size, 23px);
      background: var(--w-ink, #ffffff);
      -webkit-mask: var(--src) center / contain no-repeat;
      mask: var(--src) center / contain no-repeat;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.4));
    }
    .skin-webos:not(.display-mode) .w-icon-pebble .w-glyph-img {
      position: relative;
      z-index: 1;
      width: 26px;
      height: 26px;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
    }
    .skin-webos:not(.display-mode) .w-icon-pebble .w-glyph-photo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    .skin-webos:not(.display-mode) .w-icon-pebble .w-glyph-initials {
      position: relative;
      z-index: 1;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.45);
    }

    /* Signature Palm Pre glossy 3D steel-blue glass sphere count badge */
    .skin-webos:not(.display-mode) .w-count {
      position: absolute;
      top: -3px;
      right: -3px;
      z-index: 4;
      min-width: 21px;
      height: 21px;
      padding: 0 5px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 38% 22%, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0) 46%),
        linear-gradient(180deg, #8ab0cb 0%, #4b708c 54%, #2d475e 100%);
      border: 1.5px solid #d4e3ee;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      line-height: 18px;
      text-align: center;
      text-shadow: 0 -1px 1px rgba(0, 0, 0, 0.65);
      font-variant-numeric: tabular-nums;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
    }

    /* Tight, uncluttered two-line Palm Pre typography (no Material chevron!) */
    .skin-webos:not(.display-mode) .w-bd { flex: 1; min-width: 0; }
    .skin-webos:not(.display-mode) .w-top {
      position: relative;
      display: flex;
      align-items: baseline;
      gap: 8px;
      line-height: 18px;
    }
    .skin-webos:not(.display-mode) .w-title {
      flex: 1;
      min-width: 0;
      font-size: 14.5px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.55);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .skin-webos:not(.display-mode) .when {
      flex: none;
      font-size: 11.5px;
      font-weight: 400;
      color: #a6adb8;
      line-height: 17px;
    }
    .skin-webos:not(.display-mode) .when:hover,
    .skin-webos:not(.display-mode) .when:focus { color: #ffffff; }
    .skin-webos:not(.display-mode) .when::after {
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: linear-gradient(180deg, #2b2f36, #17191e);
      color: #f4f7fb;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.78);
    }
    /* Keep the disclosure button accessible to keyboard/screen readers but
       visually omitted on webOS pills (tapping the pill toggles it, matching Pre). */
    .skin-webos:not(.display-mode) .l-expand {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      border: 0;
      background: transparent;
    }

    .skin-webos:not(.display-mode) .w-text {
      margin: 1px 0 0;
      font-size: 13px;
      font-weight: 400;
      line-height: 17.5px;
      color: #d7dde6;
      text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.45);
      white-space: pre-line;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 1;
      line-clamp: 1;
      overflow: hidden;
    }
    .skin-webos:not(.display-mode) .w-row.l-open .w-title { white-space: normal; }
    .skin-webos:not(.display-mode) .w-row.l-open .w-text {
      -webkit-line-clamp: unset;
      line-clamp: none;
      color: #f4f7fb;
      margin-top: 3px;
    }

    /* Glossy pill Copy / Share actions inside expanded card */
    .skin-webos:not(.display-mode) .l-acts { display: none; }
    .skin-webos:not(.display-mode) .w-row.l-open .l-acts {
      display: flex;
      gap: 8px;
      margin-top: 9px;
    }
    .skin-webos:not(.display-mode) .l-acts button {
      height: 27px;
      padding: 0 13px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: linear-gradient(180deg, #5c626e, #33373f);
      color: #ffffff;
      font: 700 12px/1 var(--font);
      text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.55);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 1px 3px rgba(0, 0, 0, 0.5);
      cursor: pointer;
    }
    .skin-webos:not(.display-mode) .l-acts button:first-child {
      border-color: #82e0f4;
      background: linear-gradient(180deg, #56cce7, #1c80a2);
    }
    .skin-webos:not(.display-mode) .l-acts button:hover { filter: brightness(1.08); }
    .skin-webos:not(.display-mode) .l-acts button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    /* Classic Palm Pre bottom ticker notification banner */
    .skin-webos:not(.display-mode) .webos-ticker {
      display: flex;
      align-items: center;
      gap: 10px;
      position: fixed;
      left: 50%;
      bottom: 36px;
      z-index: 90;
      width: min(calc(100% - 20px), calc(var(--max) - 20px));
      height: 46px;
      padding: 0 11px 0 8px;
      background: linear-gradient(180deg, #474b52 0%, #34383e 48%, #26292e 100%);
      border: 1px solid #16181c;
      border-radius: 13px;
      color: #ffffff;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.26),
        0 8px 26px rgba(0, 0, 0, 0.85);
      transform: translate(-50%, 140%);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.34s cubic-bezier(0.2, 0.9, 0.25, 1), opacity 0.2s ease;
    }
    .skin-webos:not(.display-mode) .webos-ticker.is-open {
      transform: translate(-50%, 0);
      opacity: 1;
      pointer-events: auto;
    }
    .skin-webos:not(.display-mode) .webos-ticker-glyph {
      flex: none;
      display: grid;
      place-items: center;
    }
    .skin-webos:not(.display-mode) .webos-ticker-glyph .w-icon-pebble { width: 28px; height: 28px; border-radius: 7px; }
    .skin-webos:not(.display-mode) .webos-ticker-glyph .w-icon-pebble.is-orb { border-radius: 50%; }
    .skin-webos:not(.display-mode) .webos-ticker-glyph .w-icon-pebble .w-glyph-mask { width: 16px; height: 16px; }
    .skin-webos:not(.display-mode) .webos-ticker-glyph .w-icon-pebble .w-glyph-img { width: 18px; height: 18px; }
    .skin-webos:not(.display-mode) .webos-ticker-text {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .skin-webos:not(.display-mode) .webos-ticker-app {
      color: #ffffff;
      font-weight: 700;
      margin-right: 6px;
    }
    .skin-webos:not(.display-mode) .webos-ticker-close {
      flex: none;
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.38);
      color: #ffffff;
      font: 700 13px/1 var(--font);
      cursor: pointer;
    }
    .skin-webos:not(.display-mode) .webos-ticker-close:hover { background: rgba(0, 0, 0, 0.58); }

    /* Fixed bottom gesture area + glowing white light-pipe */
    .skin-webos:not(.display-mode) .webos-gesture {
      display: grid;
      place-items: center;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 32px;
      z-index: 95;
      background: linear-gradient(180deg, #090a0c, #000000);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
    }
    .skin-webos:not(.display-mode) .webos-lightpipe {
      width: 64px;
      height: 3px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.65);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.45);
      transition: width 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }
    .skin-webos:not(.display-mode) .webos-gesture:hover .webos-lightpipe {
      width: 82px;
      background: #ffffff;
      box-shadow: 0 0 12px rgba(154, 224, 255, 0.85);
    }
    .skin-webos:not(.display-mode) .webos-gesture.is-pulsing .webos-lightpipe {
      width: 112px;
      background: #ffffff;
      box-shadow: 0 0 14px 3px rgba(190, 238, 255, 0.95), 0 0 28px rgba(76, 194, 224, 0.88);
      animation: webos-pipe 1.3s ease-in-out 2;
    }
    @keyframes webos-pipe {
      0%, 100% { opacity: 0.68; transform: scaleX(0.9); }
      50%      { opacity: 1; transform: scaleX(1.12); }
    }

    .skin-webos:not(.display-mode) .theme-toast {
      bottom: 44px;
      border-radius: 12px;
      padding: 8px 16px;
      background: linear-gradient(180deg, #474b52, #2b2e34);
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.78);
      font-size: 13px;
      font-weight: 600;
    }
    .skin-webos:not(.display-mode) footer { color: #6c727d; }

    @media (prefers-reduced-motion: reduce) {
      .skin-webos:not(.display-mode) .stack.is-new,
      .skin-webos:not(.display-mode) .webos-gesture.is-pulsing .webos-lightpipe { animation: none; }
      .skin-webos:not(.display-mode) .webos-ticker { transition: none; }
    }
  </style>
</head>

<body>
  <!-- Classic Windows Phone 5-dot progress bar (visible only while refreshing in WP skin). -->
  <div class="wp-progress" id="wp-progress" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <!-- The two wallpaper layers (see .wall in the styles). -->
  <div class="wall is-showing" id="wall-a" aria-hidden="true"></div>
  <div class="wall" id="wall-b" aria-hidden="true"></div>
  <!-- ══════════════════════════════════════════════════════════════════════
       PAGE STRUCTURE
       The feed itself starts empty: the JavaScript at the bottom fills
       <main id="feed"> once the CSV has downloaded.
       ══════════════════════════════════════════════════════════════════════ -->

  <header class="site-header">
    <div class="wrap">
      <span class="wp-eyebrow" aria-hidden="true">PUSH FEED</span>
      <div class="brand-row">
        <!-- Feed health. role="status" lets screen readers announce changes
             politely, without interrupting whatever they're reading. -->
        <div class="header-tools">
          <!-- Display mode only: a broadcast-style LIVE bug and a ticking NZ
               clock. Decorative, so screen readers skip them. -->
          <div class="live-cluster" aria-hidden="true">
            <span class="live-bug" id="live-bug"><span class="live-dot"></span><span id="live-label">Live</span></span>
            <div class="live-clock">
              <div class="clock" id="clock"></div>
              <div class="clock-date" id="clock-date"></div>
            </div>
          </div>

          <p class="status" role="status" aria-live="polite">
            <span class="dot" id="status-dot"></span>
            <span id="status-text">Loading…</span>
          </p>

          <div class="theme-slider" role="radiogroup" aria-label="Theme">
            <span class="theme-thumb" aria-hidden="true"></span>
            <label title="iOS"><input type="radio" name="theme" value="ios" aria-label="iOS" checked><span aria-hidden="true"></span></label>
            <label title="Material"><input type="radio" name="theme" value="material" aria-label="Material"><span aria-hidden="true"></span></label>

  <script>
  // Wrapping everything in this function keeps our variables private, so
  // they can't clash with anything else (like a browser extension).
  (function () {
    'use strict'; // makes the browser warn about common mistakes

    /* ════════════════════════════════════════════════════════════════════
       CONFIG — the settings you might want to change.
       ════════════════════════════════════════════════════════════════════ */
    const CONFIG = {
      // The published CSV link of your Sheet's "Latest" tab
      // (File → Share → Publish to web → Latest → CSV).
      CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSeR3fuA85VYkk9nKiFzluKcxM86cBwqAgl85NQZkL3pX6NxhC_lZ1ODq8MKp7giwG4HvcKiLrIr36i/pub?gid=1296297111&single=true&output=csv',

      // How often to check for new alerts, in seconds. 60 is a good balance:
      // fast enough for "breaking news", gentle on Google's servers.
      REFRESH_SECONDS: 60,

      // Give up on a download that takes longer than this (seconds), and try
      // again at the next refresh.
      FETCH_TIMEOUT_SECONDS: 15,

      // Google serves the published CSV from several copies that don't all
      // update at the same moment, so a download can come back slightly
      // older than the one before. An alert that vanishes like that is kept
      // on screen for up to this many minutes (it reappears in a newer copy
      // well before then). Alerts deleted from the Sheet on purpose drop
      // off after this long.
      HOLD_MISSING_MINUTES: 10,

      // If no new alert has arrived for this many minutes, the status dot turns
      // amber ("gone quiet"). Overnight quiet spells are normal; a quiet
      // weekday afternoon might mean the phone needs a look.
      QUIET_AFTER_MINUTES: 180,

      // Which clock to show times in. 'Pacific/Auckland' shows NZ time to every
      // visitor wherever they are. Set it to null to use each visitor's own
      // local time instead.
      TIME_ZONE: 'Pacific/Auckland',

      // Rows to ignore even if they sneak into the CSV (matched against the
      // App column, ignoring capitals).
      IGNORE_APPS: ['heartbeat', 'test'],

      // Apps that aren't news. They're kept off the main feed and shown on
      // their own tab instead (matched against the App column, ignoring
      // capitals). Set to null to put everything on one feed.
      SIDE_TAB: { label: 'AT Mobile', apps: ['at mobile'] },

      // The same app sending the same headline again within this many
      // minutes counts as a repeat: only the first one is shown. A genuine
      // re-push later than this is kept, so the push history stays honest.
      DEDUPE_WINDOW_MINUTES: 30,

      // Wallpaper slideshow (the round button in the header): how long each
      // wallpaper stays, and how long the crossfade to the next one takes.
      // The visitor's on/off choice is remembered in their browser.
      // Display mode, Hero layout: these big publishers get a fair look-in.
      // If one of them has nothing on screen without scrolling, at most one
      // of its alerts is moved up within its own "Xh ago" group so that it
      // lands on screen. (Matched against the App column, ignoring
      // capitals. An empty list turns this off.)
      FAIR_SHARE_APPS: ['1news', 'rnz', 'stuff', 'nz herald'],

      // Display mode: each new alert lands washed in its publisher's colour
      // (by app name, ignoring capitals; anything else gets a soft white).
      BRAND_COLOURS: {
        'rnz': 'rgba(210, 65, 65, 0.85)',
        'stuff': 'rgba(196, 160, 255, 0.75)',
        '1news': 'rgba(232, 72, 40, 0.85)',
        'tvnz+': 'rgba(0, 195, 235, 0.85)',
        'the spinoff': 'rgba(0, 72, 200, 0.85)',
        'te ao māori news': 'rgba(164, 3, 47, 0.85)',
        'te ao news': 'rgba(164, 3, 47, 0.85)',
        'nz herald': 'rgba(235, 238, 245, 0.55)',
        'the post': 'rgba(30, 110, 210, 0.75)',
      },

      // Display mode, Simple layout, with Takeover switched on: how long new
      // alerts stay full-screen, plus extra time for each additional one.
      TAKEOVER_SECONDS: 3.5,
      TAKEOVER_EXTRA_SECONDS: 1.25,

      SLIDESHOW_SECONDS: 20,
      SLIDESHOW_FADE_SECONDS: 4,

      // App icons, by app name (as it appears in the App column, ignoring
      // capitals). Files live in the icons/ folder next to this page; any
      // app not listed gets its initials on a coloured square instead.
      ICONS: {
        'nz herald':        'icons/nz-herald.png',
        'rnz':              'icons/rnz.png',
        'stuff':            'icons/stuff.png',
        'the spinoff':      'icons/the-spinoff.png',
        '1news':            'icons/1news.png',
        'tvnz+':            'icons/tvnz-plus.png',
        'the post':         'icons/the-post.png',
        'te ao māori news': 'icons/te-ao-news.png',
        'te ao news':       'icons/te-ao-news.png',
        'at mobile':        'icons/at-mobile.png',
      },
    };

    /* ════════════════════════════════════════════════════════════════════
       STATE — what the page remembers between refreshes.
       ════════════════════════════════════════════════════════════════════ */
    let items = [];               // every alert from the latest download
    let seenIds = new Set();      // IDs we've already shown, to spot new arrivals
    const heldRows = new Map();   // id → { item, seenAt }: every alert recently downloaded
    let firstLoad = true;         // no "new" highlight on the very first load
    let lastCheckOk = null;       // true/false: did the last download work?
    let lastCheckedAt = null;     // when we last downloaded successfully
    let lastFetchStartedAt = 0;   // used to decide when to refresh next
    let refreshTimer = null;      // the pending "refresh again soon" timer
    let onSideTab = location.hash === '#side'; // which tab is showing; #side links straight to it
    const expandedIds = new Set(); // notifications tapped open, kept open across refreshes

    // Shortcuts to the page elements we update.
    const el = {
      tabs:       document.getElementById('tabs'),
      tabNews:    document.getElementById('tab-news'),
      tabSide:    document.getElementById('tab-side'),
      feed:       document.getElementById('feed'),
      search:     document.getElementById('search'),
      appFilter:  document.getElementById('app-filter'),
      statusDot:  document.getElementById('status-dot'),
      statusText: document.getElementById('status-text'),
      liveBug:    document.getElementById('live-bug'),
      liveLabel:  document.getElementById('live-label'),
    };

    /* ════════════════════════════════════════════════════════════════════
       STEP 1 — READING THE CSV
       A CSV is a table written as plain text: one line per row, commas
       between cells. Cells that themselves contain commas, quote marks or
       line breaks are wrapped in "double quotes", and a quote mark inside
       a cell is written twice (""). This little parser walks through the
       text one character at a time and follows exactly those rules, so
       headlines like  "Doesn't even friggin' live here": Politics…  and
       multi-line AT Mobile alerts come through intact.
       ════════════════════════════════════════════════════════════════════ */
    function parseCSV(text) {
      // Some files start with an invisible "byte order mark"; drop it.
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);

      const rows = [];
      let row = [];          // cells of the row we're building
      let cell = '';         // characters of the cell we're building
      let inQuotes = false;  // are we inside a "quoted" cell?

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];

        if (inQuotes) {
          if (ch === '"') {
            if (text[i + 1] === '"') { cell += '"'; i++; } // "" means a literal "
            else inQuotes = false;                         // closing quote
          } else {
            cell += ch;                                    // anything else, even line breaks
          }
        } else if (ch === '"') {
          inQuotes = true;                                 // opening quote
        } else if (ch === ',') {
          row.push(cell); cell = '';                       // end of a cell
        } else if (ch === '\n' || ch === '\r') {
          if (ch === '\r' && text[i + 1] === '\n') i++;    // Windows-style line ending
          row.push(cell); rows.push(row);                  // end of a row
          row = []; cell = '';
        } else {
          cell += ch;
        }
      }
      // The last row may not end with a line break.
      if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
      return rows;
    }

    /* ════════════════════════════════════════════════════════════════════
       STEP 2 — TURNING ROWS INTO ALERTS
       Columns are found by their header names (Timestamp, App, Package,
       Title, Text, Posted at), so reordering the Sheet's columns won't
       break the page. The extra "Last notification" column is ignored:
       the newest row already tells us that.
       ════════════════════════════════════════════════════════════════════ */
    function rowsToItems(rows) {
      if (!rows.length) return [];

      // Find each column's position from the header row.
      const header = rows[0].map(h => h.trim().toLowerCase());
      const col = {
        timestamp: header.indexOf('timestamp'),
        app:       header.indexOf('app'),
        pkg:       header.indexOf('package'),
        title:     header.indexOf('title'),
        text:      header.indexOf('text'),
        postedAt:  header.indexOf('posted at'),
      };
      if (col.text === -1 && col.title === -1) {
        throw new Error('The CSV has no Title or Text column. Is CSV_URL pointing at the "Latest" tab?');
      }

      // Safely read a cell: missing columns or short rows give ''.
      const get = (row, i) => (i >= 0 && i < row.length ? row[i].trim() : '');

      const out = [];
      for (const row of rows.slice(1)) {          // slice(1) skips the header row
        const app   = get(row, col.app);
        const pkg   = get(row, col.pkg);
        const title = get(row, col.title);
        const text  = get(row, col.text);

        if (!title && !text) continue;                                   // blank row
        if (CONFIG.IGNORE_APPS.includes(app.toLowerCase())) continue;    // heartbeat/test rows

        // ── When was it posted? ──
        // "Posted at" is the exact moment the phone received it, as a Unix
        // timestamp in milliseconds. Every browser reads that the same way,
        // so we prefer it. If it's missing, fall back to the Form's
        // Timestamp column (day/month/year, no time zone, so less exact).
        let time = Number(get(row, col.postedAt));
        if (!Number.isFinite(time) || time <= 0) time = parseSheetTimestamp(get(row, col.timestamp));
        if (!time) continue;                                             // can't place it in time

        // ── What's the headline? ──
        // Publishers fill Title and Text differently:
        //   NZ Herald:  Title = "NZ Herald" (just the app name), Text = headline
        //   Stuff, RNZ: Title = empty,                          Text = headline
        //   Spinoff:    Title = the author's name,              Text = headline
        //   AT Mobile:  Title = a real alert title,             Text = details
        // So: Text is the headline. Title becomes a small "byline" above it,
        // unless it's empty, just repeats the app name, or repeats the text.
        const headline = text || title;
        const showTitle = title && text &&
                          title.toLowerCase() !== app.toLowerCase() &&
                          title !== text;

        out.push({
          // A stable ID for spotting new arrivals between refreshes.
          id: pkg + '|' + time + '|' + headline.slice(0, 40),
          app: app || pkg || 'Unknown app',
          pkg,
          byline: showTitle ? title : '',
          headline,
          time,
          side: isSideApp(app),  // belongs on the side tab, not the news feed
          repeats: [],           // times of hidden repeats (see dedupe below)
        });
      }

      // Newest first. (The Sheet already sorts this way; this makes sure.)
      // Repeats are removed and the list sorted in refresh(), after this
      // download has been combined with alerts held from earlier ones.
      return out;
    }

    /* ── Removing repeats ──
       Apps sometimes post the same alert twice: an update to the same
       notification, a retry, or a phone hiccup that submits the Form twice.
       Two alerts are "the same" when they come from the same app and their
       headlines match after ignoring capitals, spacing and quote styles.
       Walking oldest → newest, the first copy is kept and any copy within
       DEDUPE_WINDOW_MINUTES of the last kept one is folded into it (its time
       is remembered, so the hover can say it was repeated). */
    function dedupe(list) {
      const windowMs = CONFIG.DEDUPE_WINDOW_MINUTES * 60000;
      const lastKept = new Map();  // sameness key → the kept alert
      const kept = [];

      for (const item of [...list].sort((a, b) => a.time - b.time)) {
        const key = (item.pkg || item.app).toLowerCase() + '|' + normalise(item.headline);
        const prev = lastKept.get(key);
        if (prev && item.time - prev.time <= windowMs) {
          prev.repeats.push(item.time);
          continue;
        }
        lastKept.set(key, item);
        kept.push(item);
      }
      return kept;
    }

    // "  ‘Clinical’:  Hospital…" and "'clinical': hospital…" → same text.
    // Sheets also drops a leading straight apostrophe, so leading quotes go too.
    function normalise(s) {
      return s.normalize('NFKC')
              .toLowerCase()
              .replace(/[‘’‛′]/g, "'")
              .replace(/[“”„″]/g, '"')
              .replace(/\s+/g, ' ')
              .trim()
              .replace(/^['"]+/, '');
    }

    function isSideApp(app) {
      return !!CONFIG.SIDE_TAB && CONFIG.SIDE_TAB.apps.includes(app.toLowerCase());
    }

    // Reads the Form's "19/10/2026 08:32:13" (day/month/year) format.
    // Only a fallback: it assumes the visitor's own time zone.
    function parseSheetTimestamp(s) {
      const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
      if (!m) return 0;
      const [, d, mo, y, h, mi, sec] = m.map(Number);
      return new Date(y, mo - 1, d, h, mi, sec || 0).getTime();
    }

    /* ════════════════════════════════════════════════════════════════════
       STEP 3 — DOWNLOADING THE CSV
       ════════════════════════════════════════════════════════════════════ */
    async function fetchFeed() {
      // "Cache buster": a different number on the end of the link every time,
      // so neither the browser nor Google can hand back an old saved copy.
      const sep = CONFIG.CSV_URL.includes('?') ? '&' : '?';
      const url = CONFIG.CSV_URL + sep + 'cb=' + Date.now();

      // Give up if Google takes too long; we'll simply try again next time.
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), CONFIG.FETCH_TIMEOUT_SECONDS * 1000);

      try {
        const res = await fetch(url, { cache: 'no-store', signal: controller.signal });
        if (!res.ok) throw new Error('Google replied with error ' + res.status);
        const text = await res.text();

        // If the Sheet stops being published, Google sends a web page
        // instead of a CSV. Catch that rather than showing gibberish.
        if (/^\s*</.test(text)) throw new Error('Got a web page instead of a CSV. Is the tab still published?');

        return rowsToItems(parseCSV(text));
      } finally {
        clearTimeout(timer);
      }
    }

    /* ════════════════════════════════════════════════════════════════════
       STEP 4 — THE REFRESH LOOP
       Download → draw → wait → repeat. A new wait only starts after the
       previous download finishes, so slow downloads can never pile up.
       While the tab is hidden (another tab open, phone locked) we pause,
       which saves the visitor's data and Google's servers; we catch up
       the moment the tab is visible again.
       ════════════════════════════════════════════════════════════════════ */
    // Never step backwards: if this download is from a copy of the CSV that
    // hasn't caught up yet, alerts we've already shown are missing from it.
    // Keep those (only ones within the time span this download covers, so
    // alerts that simply scrolled off the newest 150 still go), for up to
    // HOLD_MISSING_MINUTES since they were last downloaded.
    function combineWithHeld(downloaded) {
      const now = Date.now();
      for (const item of downloaded) heldRows.set(item.id, { item, seenAt: now });

      const oldest = downloaded.length ? Math.min(...downloaded.map(i => i.time)) : Infinity;
      const combined = [...downloaded];
      for (const [id, held] of heldRows) {
        if (held.seenAt === now) continue;                                // in this download
        if (now - held.seenAt > CONFIG.HOLD_MISSING_MINUTES * 60000 ||    // gone too long
            held.item.time < oldest) {                                    // or fell off the bottom
          heldRows.delete(id);
          continue;
        }
        combined.push(held.item);
      }

      // Fresh copies, so repeat-counting starts clean every time.
      return dedupe(combined.map(item => ({ ...item, repeats: [] }))).sort((a, b) => b.time - a.time);
    }

    async function refresh() {
      clearTimeout(refreshTimer);
      lastFetchStartedAt = Date.now();
      pulseWpBusy(true);

      try {
        const fresh = combineWithHeld(await fetchFeed());

        // Mark anything we haven't seen before as new (but not on the very
        // first load, or the whole page would flash).
        for (const item of fresh) {
          item.isNew = !firstLoad && !seenIds.has(item.id);
          seenIds.add(item.id);
        }
        // Keep the "seen" list from growing forever: remember only current IDs.
        seenIds = new Set(fresh.map(i => i.id));

        firstLoad = false;
        lastCheckOk = true;
        lastCheckedAt = Date.now();

        // Display mode: new news alerts get an entrance (see landNewAlerts),
        // after a full-screen takeover first if that's switched on.
        const arrivals = displayMode ? fresh.filter(item => item.isNew && !item.side) : [];
        const show = () => { items = fresh; updateTabs(); updateAppFilter(); };
        if (!arrivals.length) {
          show();
          render();
          if (currentSkin() === 'webos') {
            const newestNew = fresh.find(item => item.isNew);
            if (newestNew) showWebosTicker(newestNew);
          }
        } else {
          const takeover = takeoverWanted() ? await showTakeover(arrivals) : null;
          const before = displayPositions();
          show();
          render();
          const landing = landNewAlerts(arrivals, before, takeover ? { startDelay: 260, stagger: 150 } : {});
          if (takeover) await takeover.close();
          await landing;
        }
      } catch (err) {
        // Keep showing the last good data; just flag the problem.
        console.warn('Push Feed: refresh failed —', err.message);
        lastCheckOk = false;
      }

      pulseWpBusy(false);
      updateStatus();
      scheduleNext();
    }

    function scheduleNext() {
      clearTimeout(refreshTimer);
      if (document.hidden) return; // paused; the visibility listener restarts us
      refreshTimer = setTimeout(refresh, CONFIG.REFRESH_SECONDS * 1000);
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearTimeout(refreshTimer);
      } else if (Date.now() - lastFetchStartedAt > CONFIG.REFRESH_SECONDS * 1000) {
        refresh();          // been away a while: fetch right now
      } else {
        scheduleNext();     // just glanced away: carry on the normal rhythm
      }
    });

    /* ════════════════════════════════════════════════════════════════════
       STEP 5 — DRAWING THE FEED
       Every element is built with createElement + textContent, never by
       pasting text into HTML. That matters: headlines come from outside
       sources, and this way a headline containing <script> or other code
       is always shown as harmless text, never run.
       ════════════════════════════════════════════════════════════════════ */
    function render() {
      if (displayMode) return renderDisplay();
      const query = el.search.value.trim().toLowerCase();
      const app = el.appFilter.value;

      // Apply the tab, the search box and the publisher dropdown.
      const visible = tabItems().filter(item =>
        (!app || item.app === app) &&
        (!query || (item.app + ' ' + item.byline + ' ' + item.headline).toLowerCase().includes(query))
      );

      el.feed.replaceChildren(); // clear the old feed

      if (!visible.length) {
        const p = make('p', 'empty',
          (query || app) ? 'No alerts match your search.' :
          items.length ? 'Nothing on this tab yet.' :
          lastCheckOk === false ? 'Couldn’t load the feed. Retrying every minute…' :
          'No alerts yet.');
        el.feed.append(p);
        return;
      }

      // Insert a "Today" / "Yesterday" / date heading whenever the day changes.
      const isWp = currentSkin() === 'wp';
      const enterMode = isWp ? wpEnterMode : null;
      wpEnterMode = null;
      if (enterMode) el.feed.dataset.wpEnter = enterMode;
      else delete el.feed.dataset.wpEnter;

      let currentDay = null;
      let wpIndex = 0;
      for (const item of visible) {
        const day = dayKey(item.time);
        if (day !== currentDay) {
          currentDay = day;
          const label = dayLabel(item.time);
          const heading = make('h2', 'day-heading', label);
          if (isWp) {
            heading.dataset.jump = label === 'Today' ? 't' : label === 'Yesterday' ? 'y' : String(Number(day.slice(-2)));
            if (enterMode) heading.style.setProperty('--wp-i', String(Math.min(wpIndex++, 10)));
          }
          el.feed.append(heading);
        }
        const cardNode = buildCard(item);
        if (isWp && enterMode) cardNode.style.setProperty('--wp-i', String(Math.min(wpIndex++, 10)));
        el.feed.append(cardNode);
      }
      if (isWp) syncWpExpandTile();
    }

    /* ── Display mode (?display) ──
       News only, no day headings, no scrolling: just as many as fit. */
    const displayMode = document.documentElement.classList.contains('display-mode');
    let displayLayout = 'simple';

    function renderDisplay() {
      const news = items.filter(item => !item.side);
      if (!news.length) {
        el.feed.replaceChildren();
        el.feed.append(make('p', 'empty',
          lastCheckOk === false ? 'Couldn’t load the feed. Retrying every minute…' : 'No alerts yet.'));
        return;
      }

      if (displayLayout === 'hero') {
        const root = make('div', 'display-hero');
        const heroes = make('div', 'heroes');
        for (const item of news.slice(0, 2)) {
          const stack = buildCard(item);
          stack.querySelector('.card-body').append(make('div', 'exact', 'Pushed at ' + clockTime(item.time, true)));
          heroes.append(stack);
        }
        // Keep the list where someone scrolled it when the feed redraws.
        const oldStream = el.feed.querySelector('.stream');
        const scrolled = oldStream ? oldStream.scrollTop : 0;

        const stream = make('div', 'stream soft-edges');
        for (const item of news.slice(2)) stream.append(buildCard(item));
        root.append(heroes, stream);
        el.feed.replaceChildren(root);
        liftOneBuriedPublisher(stream);
        stream.scrollTop = scrolled;
        const markScrolled = () => stream.classList.toggle('is-scrolled', stream.scrollTop > 4);
        stream.addEventListener('scroll', markScrolled, { passive: true });
        markScrolled();
      } else {
        const root = make('div', 'display-simple soft-edges');
        for (const item of news.slice(0, 24)) root.append(buildCard(item));
        el.feed.replaceChildren(root);
      }
    }

    /* ── The display-mode clock ──
       Ticks on the second. Only digits that changed are replaced, and a
       replaced digit rolls in (see .roll in the styles). */
    let clockShown = '', clockFormat, clockDateFormat;

    function tickDisplayClock() {
      // Made on first use, once the time-zone setting (tz, further down) exists.
      clockFormat = clockFormat || new Intl.DateTimeFormat('en-NZ', { ...tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
      clockDateFormat = clockDateFormat || new Intl.DateTimeFormat('en-NZ', { ...tz, weekday: 'long', day: 'numeric', month: 'long' });
      const now = Date.now();
      const text = clockFormat.format(now);            // "14:32:07"
      const clock = document.getElementById('clock');

      if (!clockShown) {
        // First run: build one box per character; the last three (":07")
        // are the softer seconds.
        clock.replaceChildren();
        const hm = make('span', ''), secs = make('span', 'secs');
        [...text].forEach((ch, i) => (i >= 5 ? secs : hm).append(make('span', ch === ':' ? 'colon' : 'digit')));
        clock.append(hm, secs);
      }
      const boxes = clock.querySelectorAll('.digit, .colon');
      [...text].forEach((ch, i) => {
        if (ch === clockShown[i]) return;
        const box = boxes[i];
        if (box.classList.contains('colon')) { box.textContent = ch; return; }
        box.classList.toggle('roll', !!clockShown);   // no roll on the very first draw
        box.replaceChildren(make('span', '', ch));
      });
      clockShown = text;

      const date = clockDateFormat.format(now).replace(',', '');
      const dateEl = document.getElementById('clock-date');
      if (dateEl.textContent !== date) dateEl.textContent = date;

      setTimeout(tickDisplayClock, 1000 - (Date.now() % 1000) + 5); // land just after each new second
    }

    /* ── Fair share for the big publishers (Hero layout) ──
       One publisher pushing a lot can fill the whole screen, burying the
       others. So if a FAIR_SHARE_APPS publisher has nothing visible without
       scrolling, ONE card is lifted: that publisher's most recent card
       that can be brought on screen by moving it to the top of its own
       group of cards sharing an "Xh ago" label ("1h ago", "2h ago"...).
       Every card in that group shows the same label, so the screen never
       contradicts itself. Cards marked "Xm ago" or with a clock time never
       move, the heroes always stay the newest, and order resets to strict
       time order on every redraw. */
    function liftOneBuriedPublisher(stream) {
      if (!CONFIG.FAIR_SHARE_APPS.length) return;
      const cards = [...stream.children];
      const fold = stream.clientHeight - 48;          // above the faded bottom edge
      const aboveFold = card => card.offsetTop + card.offsetHeight <= fold;
      const label = card => notificationTime(Number(card.dataset.time));

      // Publishers already on screen: the heroes, plus list cards above the fold.
      const onScreen = new Set([...el.feed.querySelectorAll('.heroes .stack')].map(s => s.dataset.app));
      for (const card of cards) if (aboveFold(card)) onScreen.add(card.dataset.app);

      // The first card of each "Xh ago" group, but only groups that start
      // on screen (lifting into a group that starts below the fold wouldn't
      // bring anything into view).
      const groupStart = new Map();
      for (const card of cards) {
        const l = label(card);
        if (/h ago$/.test(l) && !groupStart.has(l)) groupStart.set(l, card);
      }

      // Candidates: buried big publishers' cards in such a group, newest first.
      const pick = cards.find(card =>
        CONFIG.FAIR_SHARE_APPS.includes(card.dataset.app) &&
        !onScreen.has(card.dataset.app) &&
        !aboveFold(card) &&
        groupStart.has(label(card)) &&
        aboveFold(groupStart.get(label(card))));
      if (!pick) return;
      const home = pick.nextElementSibling;           // to put it back if needed
      groupStart.get(label(pick)).before(pick);
      if (!aboveFold(pick)) {                         // taller card still didn't fit: undo
        if (home) home.before(pick); else stream.append(pick);
      }
    }

    /* ── How new alerts arrive in display mode ──
       Cards already on screen glide to their new places (a hero dropping
       into the list slides in instead of stretching; a card pushed out of
       view fades where it was). Then the new cards appear one after
       another, oldest first and newest last so the eye ends on the newest,
       each washed in its publisher's colour that fades over a few seconds,
       with one sheen across it. Moving cards drop the frosted blur while
       they move, which keeps it smooth. */
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

    function displayPositions() {
      const map = new Map();
      for (const stack of el.feed.querySelectorAll('.stack')) map.set(stack.dataset.id, stack.getBoundingClientRect());
      return map;
    }

    function brandColour(app) {
      return CONFIG.BRAND_COLOURS[app.toLowerCase()] || 'rgba(235, 238, 245, 0.45)';
    }

    async function landNewAlerts(arrivals, before, { startDelay = 180, stagger = 260 } = {}) {
      if (reducedMotion.matches) return;
      const ids = new Set(arrivals.map(a => a.id));
      const moving = [];
      const ease = 'cubic-bezier(.2, .8, .2, 1)';

      for (const stack of el.feed.querySelectorAll('.stack')) {
        if (ids.has(stack.dataset.id)) continue;
        const was = before.get(stack.dataset.id);
        if (!was) continue;
        const now = stack.getBoundingClientRect();
        const dx = was.left - now.left, dy = was.top - now.top;
        const clip = stack.closest('.soft-edges');
        const box = clip && clip.getBoundingClientRect();
        moving.push(stack);
        if (box && (now.left >= box.right - 1 || now.top >= box.bottom - 1)) {
          stack.animate([{ transform: `translate(${dx}px, ${dy}px)`, opacity: 1 },
                         { transform: `translate(${dx}px, ${dy + 24}px)`, opacity: 0 }],
                        { duration: 500, easing: 'ease-in', fill: 'backwards' });
        } else if (Math.abs(was.width - now.width) < 2 && Math.abs(was.height - now.height) < 2) {
          if (dx || dy) stack.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }],
                                      { duration: 700, easing: ease, fill: 'backwards' });
        } else {
          stack.animate([{ opacity: 0, transform: 'translateX(-1.6rem)' }, { opacity: 1, transform: 'none' }],
                        { duration: 600, delay: 120, easing: ease, fill: 'backwards' });
        }
      }

      // Only the new cards that made it on screen, oldest first. A big
      // batch is squeezed so the whole sequence takes under a second
      // (otherwise the hero spots sit empty while the newest wait their turn).
      const landing = [...arrivals].reverse()
        .map(item => ({ item, stack: el.feed.querySelector(`.stack[data-id="${CSS.escape(item.id)}"]`) }))
        .filter(x => x.stack);
      const step = landing.length > 1 ? Math.min(stagger, 900 / (landing.length - 1)) : 0;

      landing.forEach(({ item, stack }, i) => {
        const card = stack.querySelector('.card');
        moving.push(stack);
        const delay = startDelay + i * step;
        const big = !!stack.closest('.heroes');
        stack.animate([{ opacity: 0, transform: big ? 'translateY(-0.8rem) scale(0.985)' : 'translateY(-0.5rem) scale(0.96)' },
                       { opacity: 1, transform: 'none' }],
                      { duration: 600, delay, easing: 'cubic-bezier(.2, .9, .3, 1.05)', fill: 'backwards' });
        const wash = make('span', 'wash');
        wash.style.background = brandColour(item.app);
        card.prepend(wash);
        wash.animate([{ opacity: 1 }, { opacity: 1, offset: 0.3 }, { opacity: 0 }],
                     { duration: 4500, delay, easing: 'ease-out', fill: 'both' })
            .finished.then(() => wash.remove(), () => wash.remove());
        setTimeout(() => card.classList.add('fx-shine'), delay + 150);
        setTimeout(() => card.classList.remove('fx-shine'), delay + 2200);
      });

      for (const stack of moving) stack.classList.add('is-moving');
      await new Promise(r => setTimeout(r, startDelay + Math.max(0, landing.length - 1) * step + 900));
      for (const stack of moving) stack.classList.remove('is-moving');
    }

    /* ── Breaking takeover (Simple layout, Takeover switched on) ──
       Dims the screen and shows the newest arrivals (up to three) large in
       the middle, newest on top, coming in from the bottom up, with a bar
       that empties to show how long they'll stay. Resolves when it's time
       to leave; close() then fades the big cards out, drifting a little
       towards their places, while the real cards land underneath. Nothing
       is stretched or squashed, so text never distorts. */
    function takeoverWanted() {
      return displayMode && displayLayout === 'simple' && document.getElementById('takeover-check').checked;
    }

    async function showTakeover(arrivals) {
      const shown = arrivals.slice(0, 3);
      const dim = make('div', 'takeover-dim');
      const box = make('div', 'takeover' + (shown.length > 1 ? ' is-multi' : '') + (shown.length > 2 ? ' is-many' : ''));
      box.setAttribute('aria-hidden', 'true');
      const kicker = make('div', 'takeover-kicker',
        arrivals.length === 1 ? 'Just in' :
        arrivals.length > shown.length ? `${arrivals.length} new alerts · latest ${shown.length}` :
        `${arrivals.length} new alerts`);
      const cards = shown.map(item => {
        const t = make('article', 'tcard');
        t.dataset.id = item.id;
        t.style.setProperty('--brand', brandColour(item.app));
        const row = make('div', 'tcard-row');
        row.append(buildIcon(item), make('span', '', item.byline || item.app), make('span', 'when', notificationTime(item.time)));
        t.append(row, make('h2', '', item.headline), make('div', 'pushed', 'Pushed at ' + clockTime(item.time, true)));
        return t;
      });
      const timer = make('div', 'takeover-timer');
      const fill = make('span');
      timer.append(fill);
      box.append(kicker, ...cards, timer);
      document.body.append(dim, box);

      // Shrink the whole stack evenly if long headlines make it too tall.
      const room = innerHeight * 0.9;
      const tall = [...box.children].reduce((h, c) => h + c.getBoundingClientRect().height, 0) +
                   (box.children.length - 1) * parseFloat(getComputedStyle(box).rowGap || 0);
      if (tall > room) box.style.transform = `scale(${(room / tall).toFixed(3)})`;

      const ease = 'cubic-bezier(.2, .9, .3, 1.05)';
      dim.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 450, easing: 'ease-out', fill: 'both' });
      kicker.animate([{ opacity: 0, transform: 'translateY(0.6rem)' }, { opacity: 1, transform: 'none' }],
                     { duration: 500, delay: 100, easing: ease, fill: 'backwards' });
      [...cards].reverse().forEach((t, i) => t.animate(
        [{ opacity: 0, transform: 'translateY(2.2rem) scale(0.96)' }, { opacity: 1, transform: 'none' }],
        { duration: 650, delay: 180 + i * 220, easing: ease, fill: 'backwards' }));
      const entrance = 180 + (cards.length - 1) * 220 + 650;
      const hold = (CONFIG.TAKEOVER_SECONDS + (shown.length - 1) * CONFIG.TAKEOVER_EXTRA_SECONDS) * 1000;
      timer.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400, delay: entrance - 300, fill: 'backwards' });
      fill.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }], { duration: hold, delay: entrance, easing: 'linear', fill: 'both' });
      await new Promise(r => setTimeout(r, entrance + hold));

      return {
        async close() {
          const out = { duration: 520, easing: 'cubic-bezier(.4, 0, .6, 1)', fill: 'forwards' };
          for (const t of cards) {
            const from = t.getBoundingClientRect();
            const target = el.feed.querySelector(`.stack[data-id="${CSS.escape(t.dataset.id)}"]`);
            const to = target ? target.getBoundingClientRect() : null;
            const dx = to ? (to.left + to.width / 2 - (from.left + from.width / 2)) * 0.33 : 0;
            const dy = to ? (to.top + to.height / 2 - (from.top + from.height / 2)) * 0.33 : 30;
            t.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translate(${dx}px, ${dy}px) scale(0.9)` }], out);
          }
          for (const part of [kicker, timer]) part.animate([{ opacity: 1 }, { opacity: 0 }], out);
          await dim.animate([{ opacity: 1 }, { opacity: 0 }], { ...out, duration: 600 }).finished;
          dim.remove();
          box.remove();
        },
      };
    }

    function setDisplayLayout(layout) {
      displayLayout = layout === 'hero' ? 'hero' : 'simple';
      for (const button of document.querySelectorAll('#mode-toggle button')) {
        button.setAttribute('aria-pressed', String(button.dataset.layout === displayLayout));
      }
      document.getElementById('takeover-toggle').hidden = displayLayout !== 'simple';
      // Remember it in the address (so a bookmark opens the same way) and
      // in this browser.
      history.replaceState(null, '', '?display=' + displayLayout);
      try { localStorage.setItem('pushFeedDisplay', displayLayout); } catch (e) { /* fine */ }
      render();
    }

    const PUBLISHERS = {
      'nz herald':        { colour: '#1a1a1a', glyph: 'nz-herald',   icon: 'nz-herald' },
      'rnz':              { colour: '#c62828', glyph: 'rnz',         icon: 'rnz' },
      'stuff':            { colour: '#5e35b1', glyph: 'stuff',       icon: 'stuff' },
      'the spinoff':      { colour: '#0048c8', glyph: 'the-spinoff', icon: 'the-spinoff', circleGlyph: 'the-spinoff-s' },
      '1news':            { colour: '#c8412f', glyph: '1news',       icon: '1news', colourGlyph: true, circleGlyph: '1news-motif', smallGlyph: '1news-motif' },
      'tvnz+':            { colour: '#0072ff', glyph: 'tvnz-plus',   icon: 'tvnz-plus', colourGlyph: true },
      'the post':         { colour: '#1565c0', icon: 'the-post' },
      'te ao māori news': { colour: '#a4032f', icon: 'te-ao-news' },
      'te ao news':       { colour: '#a4032f', icon: 'te-ao-news' },
      'at mobile':        { colour: '#0073bd', glyph: 'at-mobile',   icon: 'at-mobile' },
    };
    function publisher(app) {
      const p = PUBLISHERS[app.toLowerCase()];
      if (p) return p;
      let hash = 0;   // unknown app: a steady colour from its name, no glyph
      for (const ch of app) hash = (hash * 31 + ch.codePointAt(0)) >>> 0;
      return { colour: `hsl(${hash % 360} 52% 40%)` };
    }
    function glyph(item, p) {
      if (p.smallGlyph) {   // a one-colour mark drawn for small sizes (1News)
        const s = make('span', 'l-glyph l-tint'); s.style.setProperty('--src', `url("svgs/glyphs/${p.smallGlyph}.svg")`); return s;
      }
      if (p.glyph && p.colourGlyph) {
        const i = make('img', 'l-glyph l-img'); i.src = `svgs/glyphs/${p.glyph}.svg`; i.alt = ''; return i;
      }
      if (p.glyph) {
        const s = make('span', 'l-glyph l-tint'); s.style.setProperty('--src', `url("svgs/glyphs/${p.glyph}.svg")`); return s;
      }
      if (p.icon) {
        const i = make('img', 'l-glyph l-photo'); i.src = `icons/${p.icon}.png`; i.alt = ''; return i;
      }
      return make('span', 'l-glyph l-initials', initials(item.app));
    }

    function buildNougat(item) {
      const p = publisher(item.app);
      const r = make('article', 'l-row' + (item.isNew ? ' is-new' : '') + (expandedIds.has(item.id) ? ' l-open' : ''));
      r.style.setProperty('--accent', p.colour);

      const hd = make('div', 'l-hd');
      const t = make('time', 'when', notificationTime(item.time));
      t.dataset.time = item.time;
      t.dateTime = new Date(item.time).toISOString();
      t.title = fullTime(item);
      t.dataset.full = t.title;
      t.tabIndex = 0;
      t.setAttribute('aria-label', t.title);
      hd.append(glyph(item, p), make('span', 'l-app', item.app), make('span', 'l-sep', '•'), t);
      if (item.repeats.length) hd.append(make('span', 'l-count', String(item.repeats.length + 1)));

      r.append(hd);
      if (item.byline) r.append(make('div', 'l-author', item.byline));
      r.append(make('p', 'l-text', item.headline));

      const acts = make('div', 'l-acts');
      const copyBtn = make('button', '', 'Copy'), shareBtn = make('button', '', 'Share');
      copyBtn.type = shareBtn.type = 'button';
      copyBtn.onclick = async e => { e.stopPropagation(); toast(await copyHeadline(item) === 'copied' ? 'Headline copied' : 'Couldn’t copy'); };
      shareBtn.onclick = async e => { e.stopPropagation(); const res = await shareHeadline(item); if (res === 'copied') toast('Headline copied'); else if (res === 'failed') toast('Couldn’t share this headline'); };
      acts.append(copyBtn, shareBtn);
      r.append(acts);

      wireLegacyExpansion(r, item, hd);
      return r;
    }

    // Glyph size inside the 40dp circle, by glyph file, so each mark
    // looks equally heavy (Android's small icons sit in a 24dp box).
    const SIZE = { 'nz-herald': 18, 'rnz': 24, 'the-spinoff-s': 15, 'stuff': 17, '1news-motif': 24, 'at-mobile': 24 };

    function circle(item, p) {
      const c = make('div', 'l-circle');
      const file = p.circleGlyph || (!p.colourGlyph && p.glyph);
      if (file) {
        const g = make('span', 'l-g');
        g.style.setProperty('--src', `url("svgs/glyphs/${file}.svg")`);
        if (SIZE[file]) g.style.setProperty('--size', SIZE[file] + 'px');
        c.append(g);
      } else if (p.glyph) {               // colour glyph with no one-colour version (TVNZ+)
        c.classList.add('l-colour');
        const i = make('img'); i.src = `svgs/glyphs/${p.glyph}.svg`; i.alt = ''; c.append(i);
      } else if (p.icon) {                // no glyph yet: its app icon
        const i = make('img', 'l-photo'); i.src = `icons/${p.icon}.png`; i.alt = ''; c.append(i);
      } else {
        c.append(make('span', 'l-initials', initials(item.app)));
      }
      return c;
    }

    // Title line: the alert's own top text when it has one ("Breaking
    // news", an author, AT Mobile's alert title), otherwise the app's name.
    // The alert text goes underneath.
    function lines(item) {
      return [item.byline || item.app, item.headline];
    }

    function buildMarshmallow(item) {
      const p = publisher(item.app);
      const n = make('article', 'l-card' + (item.isNew ? ' is-new' : '') + (expandedIds.has(item.id) ? ' l-open' : ''));
      n.style.setProperty('--accent', p.colour);
      n.setAttribute('aria-label', item.app);

      const row = make('div', 'l-row');
      const body = make('div', 'l-body');
      const [title, sub] = lines(item);
      // Head row: title, then time (and repeat count) and the expand chevron.
      const side = make('div', 'l-head');
      side.append(make('div', 'l-title', title));
      body.append(side);
      if (sub) body.append(make('div', 'l-sub', sub));

      const t = make('time', 'when', notificationTime(item.time));
      t.dataset.time = item.time;
      t.dateTime = new Date(item.time).toISOString();
      t.title = fullTime(item);
      t.dataset.full = t.title;
      t.tabIndex = 0;
      t.setAttribute('aria-label', t.title);
      side.append(t);
      if (item.repeats.length) side.append(make('span', 'l-count', String(item.repeats.length + 1)));
      row.append(circle(item, p), body);

      const acts = make('div', 'l-acts');
      acts.innerHTML =
        '<button type="button" data-act="copy"><svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>Copy</button>' +
        '<button type="button" data-act="share"><svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7a3.3 3.3 0 0 0 0-1.39l7.05-4.11A2.99 2.99 0 1 0 15 5c0 .24.04.47.09.7L8.04 9.81A2.99 2.99 0 1 0 8.04 14.2l7.12 4.16a2.82 2.82 0 1 0 2.84-2.28z"/></svg>Share</button>';
      acts.addEventListener('click', async e => {
        e.stopPropagation();
        const b = e.target.closest('button'); if (!b) return;
        if (b.dataset.act === 'copy') toast(await copyHeadline(item) === 'copied' ? 'Headline copied' : 'Couldn’t copy');
        else {
          const result = await shareHeadline(item);
          if (result === 'copied') toast('Headline copied');
          else if (result === 'failed') toast('Couldn’t share this headline');
        }
      });
      n.append(row, acts);

      wireLegacyExpansion(n, item, side);
      return n;
    }

    function wireLegacyExpansion(card, item, host) {
      const button = make('button', 'l-expand');
      button.type = 'button';
      button.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>';
      const sync = () => {
        const expanded = card.classList.contains('l-open');
        button.setAttribute('aria-expanded', String(expanded));
        button.setAttribute('aria-label', (expanded ? 'Collapse' : 'Expand') + ' alert from ' + item.app);
      };
      const toggle = () => {
        card.classList.toggle('l-open');
        if (card.classList.contains('l-open')) expandedIds.add(item.id);
        else expandedIds.delete(item.id);
        sync();
        if (currentSkin() === 'wp') syncWpExpandTile();
      };
      button.addEventListener('click', event => { event.stopPropagation(); toggle(); });
      card.addEventListener('click', event => {
        if (!event.target.closest('.when, button, .l-acts')) toggle();
      });
      host.append(button);
      sync();
    }

    function buildWindowsPhone(item) {
      const p = publisher(item.app);
      const n = make('article', 'wp-item' + (item.isNew ? ' is-new' : '') + (expandedIds.has(item.id) ? ' l-open' : ''));
      n.style.setProperty('--accent', p.colour);

      const row = make('div', 'wp-row');
      const body = make('div', 'wp-body');
      const top = make('div', 'wp-top');

      const t = make('time', 'when', notificationTime(item.time));
      t.dataset.time = item.time;
      t.dateTime = new Date(item.time).toISOString();
      t.title = fullTime(item);
      t.dataset.full = t.title;
      t.tabIndex = 0;
      t.setAttribute('aria-label', t.title);

      top.append(make('span', 'wp-app', item.app));
      if (item.repeats.length) top.append(make('span', 'wp-count', String(item.repeats.length + 1)));
      top.append(t);

      body.append(top);
      if (item.byline) body.append(make('div', 'wp-byline', item.byline));
      body.append(make('p', 'wp-text', item.headline));

      // Live Tile: front shows the monochrome square glyph; grouped alerts
      // get a two-sided 3D flipping Live Tile with the repeat count on the back.
      const stage = make('div', 'wp-tile-stage');
      const flip = make('div', 'wp-tile-flip' + (item.repeats.length ? ' is-live' : ''));
      const front = make('div', 'wp-tile-front');
      front.append(circle(item, p));
      flip.append(front);
      if (item.repeats.length) {
        let hash = 0;
        for (const ch of item.id) hash = (hash * 31 + ch.codePointAt(0)) >>> 0;
        flip.style.setProperty('--wp-flip-delay', ((hash % 40) * 0.12 + 0.6).toFixed(2) + 's');
        const back = make('div', 'wp-tile-back');
        back.setAttribute('aria-hidden', 'true');
        back.append(make('strong', '', String(item.repeats.length + 1)), make('small', '', 'alerts'));
        flip.append(back);
      }
      stage.append(flip);
      row.append(stage, body);

      const acts = make('div', 'l-acts');
      const copyBtn = make('button', '', 'copy'), shareBtn = make('button', '', 'share');
      copyBtn.type = shareBtn.type = 'button';
      copyBtn.onclick = async e => { e.stopPropagation(); toast(await copyHeadline(item) === 'copied' ? 'headline copied' : 'couldn’t copy'); };
      shareBtn.onclick = async e => { e.stopPropagation(); const res = await shareHeadline(item); if (res === 'copied') toast('headline copied'); else if (res === 'failed') toast('couldn’t share this headline'); };
      acts.append(copyBtn, shareBtn);
      n.append(row, acts);

      wireLegacyExpansion(n, item, top);
      return n;
    }

    // Chunky 2009 glossy 3D Palm Pre pebble/orb icon styles per publisher.
    const WEBOS_GLYPH_STYLE = {
      'nz-herald':   { pebble: 'linear-gradient(180deg, #f8fafd 0%, #c8d2de 100%)', ink: '#14181e', size: 22 },
      'rnz':         { pebble: 'linear-gradient(180deg, #f24a42 0%, #9e1414 100%)', ink: '#ffffff', size: 25, orb: true },
      'stuff':       { pebble: 'linear-gradient(180deg, #986ef0 0%, #4b2396 100%)', ink: '#ffffff', size: 21 },
      'the-spinoff': { pebble: 'linear-gradient(180deg, #43a1ff 0%, #0d4db5 100%)', ink: '#ffffff', size: 24, orb: true },
      '1news-motif': { pebble: 'linear-gradient(180deg, #ff6c45 0%, #b82414 100%)', ink: '#ffffff', size: 25, orb: true },
      'at-mobile':   { pebble: 'linear-gradient(180deg, #4cc7f5 0%, #0b69ad 100%)', ink: '#ffffff', size: 25, orb: true },
    };

    function webosGlyph(item) {
      const p = publisher(item.app);
      const maskFile = p.smallGlyph || (!p.colourGlyph && p.glyph);
      const st = maskFile && WEBOS_GLYPH_STYLE[maskFile];
      const pebble = make('div', 'w-icon-pebble' + (st && st.orb ? ' is-orb' : ''));
      if (maskFile) {
        if (st) pebble.style.setProperty('--w-pebble', st.pebble);
        const g = make('span', 'w-glyph-mask');
        g.style.setProperty('--src', `url("svgs/glyphs/${maskFile}.svg")`);
        if (st) {
          g.style.setProperty('--w-ink', st.ink);
          g.style.setProperty('--w-size', st.size + 'px');
        }
        pebble.append(g);
      } else if (p.glyph) {
        pebble.style.setProperty('--w-pebble', 'linear-gradient(180deg, #273244 0%, #101620 100%)');
        const img = make('img', 'w-glyph-img');
        img.src = `svgs/glyphs/${p.glyph}.svg`;
        img.alt = '';
        pebble.append(img);
      } else if (p.icon) {
        const img = make('img', 'w-glyph-photo');
        img.src = `icons/${p.icon}.png`;
        img.alt = '';
        img.decoding = 'async';
        img.addEventListener('error', () => img.replaceWith(make('span', 'w-glyph-initials', initials(item.app))), { once: true });
        pebble.append(img);
      } else {
        pebble.style.setProperty('--w-pebble', `linear-gradient(180deg, ${p.colour}, #1b1e24)`);
        pebble.append(make('span', 'w-glyph-initials', initials(item.app)));
      }
      return pebble;
    }

    function buildWebOS(item) {
      const hasRepeats = item.repeats.length > 0;
      const n = make('article', 'w-row ' + (hasRepeats ? 'is-split' : 'is-single') +
        (item.isNew ? ' is-new' : '') + (expandedIds.has(item.id) ? ' l-open' : ''));

      const bd = make('div', 'w-bd');
      const top = make('div', 'w-top');
      const t = make('time', 'when', notificationTime(item.time));
      t.dataset.time = item.time;
      t.dateTime = new Date(item.time).toISOString();
      t.title = fullTime(item);
      t.dataset.full = t.title;
      t.tabIndex = 0;
      t.setAttribute('aria-label', t.title);

      top.append(make('span', 'w-title', item.byline || item.app), t);
      bd.append(top, make('p', 'w-text', item.headline));

      const acts = make('div', 'l-acts');
      const copyBtn = make('button', '', 'Copy'), shareBtn = make('button', '', 'Share');
      copyBtn.type = shareBtn.type = 'button';
      copyBtn.onclick = async e => { e.stopPropagation(); toast(await copyHeadline(item) === 'copied' ? 'Headline copied' : 'Couldn’t copy'); };
      shareBtn.onclick = async e => { e.stopPropagation(); const res = await shareHeadline(item); if (res === 'copied') toast('Headline copied'); else if (res === 'failed') toast('Couldn’t share this headline'); };
      acts.append(copyBtn, shareBtn);
      bd.append(acts);

      if (hasRepeats) {
        // Grouped alert: separate left icon pill (with top-right teal count badge) + right text pill
        const iconPill = make('div', 'w-icon-pill');
        iconPill.append(webosGlyph(item), make('span', 'w-count', String(item.repeats.length + 1)));
        const textPill = make('div', 'w-text-pill');
        textPill.append(bd);
        n.append(iconPill, textPill);
      } else {
        // Single alert: one continuous smoky-slate rounded pill
        n.append(webosGlyph(item), bd);
      }

      wireLegacyExpansion(n, item, top);
      return n;
    }

    function buildLegacyCard(item) {
      const stack = make('div', 'stack' + (item.isNew ? ' is-new' : ''));
      stack.dataset.id = item.id;
      stack.dataset.app = item.app.toLowerCase();
      stack.dataset.time = item.time;
      const skin = currentSkin();
      stack.append(
        skin === 'nougat' ? buildNougat(item) :
        skin === 'wp' ? buildWindowsPhone(item) :
        skin === 'webos' ? buildWebOS(item) :
        buildMarshmallow(item)
      );
      return stack;
    }
    let themeToastTimer;
    function toast(message) {
      const node = document.getElementById('theme-toast');
      node.textContent = message;
      node.classList.remove('wp-toast-pop');
      void node.offsetWidth;
      if (currentSkin() === 'wp') node.classList.add('wp-toast-pop');
      clearTimeout(themeToastTimer);
      themeToastTimer = setTimeout(() => { node.textContent = ''; node.classList.remove('wp-toast-pop'); }, 2200);
    }
    async function copyHeadline(item) {
      try { await navigator.clipboard.writeText(item.headline); return 'copied'; }
      catch (e) { return 'failed'; }
    }
    async function shareHeadline(item) {
      if (navigator.share) {
        try { await navigator.share({ text: item.headline + ' — ' + item.app }); return 'shared'; }
        catch (e) { if (e.name === 'AbortError') return 'cancelled'; }
      }
      return copyHeadline(item);
    }

    // Builds one iOS-style notification:
    //   [icon]  Title (alert title, author, or the app's name)     12m ago
    //           The alert text, cut to four lines until tapped
    // Hidden repeats show as a stacked card underneath plus a red badge.
    function buildCard(item) {
      const skin = currentSkin();
      if (skin === 'nougat' || skin === 'marshmallow' || skin === 'wp' || skin === 'webos') return buildLegacyCard(item);
      const stack = make('div', 'stack' +
        (item.repeats.length ? ' has-repeats' : '') +
        (item.isNew ? ' is-new' : ''));
      stack.dataset.id = item.id;
      stack.dataset.app = item.app.toLowerCase();
      stack.dataset.time = item.time;
      const card = make('article', 'card' + (expandedIds.has(item.id) ? ' is-expanded' : ''));

      // Tap to show the whole alert, tap again to cut it back to four lines.
      card.addEventListener('click', event => {
        if (event.target.closest('.when')) return; // that tap is for the exact time
        card.classList.toggle('is-expanded');
        if (card.classList.contains('is-expanded')) expandedIds.add(item.id);
        else expandedIds.delete(item.id);
      });

      card.append(materialSkin() ? themedIcon(item) : buildIcon(item), make('div', 'card-body'));
      const body = card.lastChild;

      // The time ("12m ago"), which expands to the exact moment on hover
      // (or tap / keyboard focus, so it works on phones too). tickClock()
      // keeps it current, finding it by its data-time attribute.
      const when = make('time', 'when', notificationTime(item.time));
      when.dateTime = new Date(item.time).toISOString();
      when.dataset.time = item.time;
      when.dataset.full = fullTime(item);
      when.tabIndex = 0;
      when.setAttribute('aria-label', when.dataset.full);

      const top = make('div', 'card-top');

      if (materialSkin()) {
        // Android layout:
        //   (icon)  NZ Herald • 12m                          [2 ⌄]
        //           Title (only when the alert has its own)
        //           The alert text, two lines until tapped
        top.append(make('span', 'm-app', item.app), make('span', 'm-sep', '•'), when);
        body.append(top);
        if (item.byline) body.append(make('div', 'm-title', item.byline));
        body.append(make('p', 'headline' + (item.byline ? '' : ' is-lead'), item.headline));
        const pill = make('span', 'm-expand');
        pill.setAttribute('aria-hidden', 'true');
        if (item.repeats.length) pill.append(String(item.repeats.length + 1));
        pill.insertAdjacentHTML('beforeend',
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>');
        card.append(pill);
      } else {
        top.append(make('span', 'title', item.byline || item.app), when);
        body.append(top, make('p', 'headline', item.headline));
      }
      stack.append(card);
      return stack;
    }

    // Material You's themed icon: the publisher's one-colour mark on a
    // tonal circle (see circle(), shared with the Marshmallow theme).
    function themedIcon(item) {
      const box = make('div', 'icon m-themed');
      box.setAttribute('role', 'img');
      box.setAttribute('aria-label', item.app);
      box.append(circle(item, publisher(item.app)));
      return box;
    }

    // The Android Material skin applies outside display mode only.
    function materialSkin() {
      const root = document.documentElement.classList;
      return root.contains('skin-material') && !root.contains('display-mode');
    }

    // The app's icon if we have one, otherwise its initials on a steady
    // colour. The badge counts this alert plus its hidden repeats, the way
    // iOS counts a stack.
    function buildIcon(item) {
      const box = make('div', 'icon');
      const src = CONFIG.ICONS[item.app.toLowerCase()];
      let img;
      if (src) {
        img = make('img');
        img.src = src;
        img.alt = item.app;
        img.width = img.height = 38;
        img.decoding = 'async';
        // A missing file falls back to initials rather than a broken image.
        img.addEventListener('error', () => img.replaceWith(initialsTile(item)), { once: true });
      }
      box.append(img || initialsTile(item));
      if (item.repeats.length) box.append(make('span', 'badge', String(item.repeats.length + 1)));
      return box;
    }

    function initialsTile(item) {
      const tile = make('span', 'initials', initials(item.app));
      tile.style.background = colourFor(item.pkg || item.app);
      tile.setAttribute('role', 'img');
      tile.setAttribute('aria-label', item.app);
      return tile;
    }

    // Small helper: create an element with a class and some text.
    function make(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    // The alerts belonging to the tab that's showing.
    function tabItems() {
      return items.filter(item => item.side === onSideTab);
    }

    // Labels the tabs with counts, e.g. "News 142" / "AT Mobile 8", and
    // marks the selected one.
    function updateTabs() {
      if (!CONFIG.SIDE_TAB) { el.tabs.hidden = true; syncFeedBar(); return; }
      const sideCount = items.filter(item => item.side).length;
      const label = (button, text, n) => {
        button.replaceChildren(text, make('span', 'count', String(n)));
      };
      label(el.tabNews, 'News', items.length - sideCount);
      label(el.tabSide, CONFIG.SIDE_TAB.label, sideCount);
      el.tabNews.setAttribute('aria-selected', String(!onSideTab));
      el.tabSide.setAttribute('aria-selected', String(onSideTab));
      syncFeedBar();
    }

    function switchTab(side) {
      if (side === onSideTab) return;
      onSideTab = side;
      history.replaceState(null, '', side ? '#side' : location.pathname + location.search);
      if (currentSkin() === 'wp') {
        wpEnterMode = side ? 'pivot-next' : 'pivot-prev';
        el.tabs.classList.remove('wp-pivot-next', 'wp-pivot-prev');
        void el.tabs.offsetWidth;
        el.tabs.classList.add(side ? 'wp-pivot-next' : 'wp-pivot-prev');
      }
