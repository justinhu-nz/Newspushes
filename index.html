      updateTabs();
      updateAppFilter();
      render();
    }

    // Fills the publisher dropdown with every app on this tab, plus counts,
    // e.g. "RNZ (12)". Keeps whatever the visitor had selected.
    function updateAppFilter() {
      const counts = new Map();
      for (const item of tabItems()) counts.set(item.app, (counts.get(item.app) || 0) + 1);

      const chosen = el.appFilter.value;
      const names = [...counts.keys()].sort((a, b) => a.localeCompare(b));

      el.appFilter.replaceChildren(new Option('All apps', ''));
      for (const name of names) el.appFilter.append(new Option(`${name} (${counts.get(name)})`, name));

      // If their chosen publisher has dropped out of the latest 150, reset.
      el.appFilter.value = counts.has(chosen) ? chosen : '';
    }

    /* ════════════════════════════════════════════════════════════════════
       STEP 6 — THE STATUS LINE
         green  ● Last alert 3 min ago      everything's flowing
         amber  ● Quiet for 4 h             no alerts for a while (normal overnight)
         red    ● Can't reach the feed      download failed; showing older data
       ════════════════════════════════════════════════════════════════════ */
    function updateStatus() {
      const newest = items.length ? items[0].time : null;
      let state, text;

      if (lastCheckOk === false) {
        state = 'is-bad';
        text = items.length ? 'Can’t reach the feed · showing older alerts' : 'Can’t reach the feed';
      } else if (!newest) {
        state = '';
        text = 'Waiting for the first alert';
      } else if (Date.now() - newest > CONFIG.QUIET_AFTER_MINUTES * 60000) {
        state = 'is-warn';
        text = 'Quiet for ' + timeAgo(newest).replace(' ago', '');
      } else {
        state = 'is-ok';
        text = 'Last alert ' + timeAgo(newest);
      }

      el.statusDot.className = 'dot ' + state;
      // The display-mode LIVE bug follows the same health.
      el.liveBug.dataset.state = state;
      el.liveLabel.textContent = state === 'is-warn' ? 'Quiet' : state === 'is-bad' ? 'Offline' : 'Live';
      el.statusText.textContent = text;
      // Hovering the status shows exactly when we last checked.
      el.statusText.title = lastCheckedAt ? 'Checked at ' + clockTime(lastCheckedAt, true) : '';
    }

    // Every 30 seconds, update the "12m ago" labels and the status line
    // without downloading anything.
    function tickClock() {
      for (const node of el.feed.querySelectorAll('.when')) {
        node.textContent = notificationTime(Number(node.dataset.time));
      }
      updateStatus();
    }

    /* ════════════════════════════════════════════════════════════════════
       TIME HELPERS
       ════════════════════════════════════════════════════════════════════ */
    // "just now", "3m ago", "2h ago", "4d ago" (for the status line)
    function timeAgo(ms) {
      const s = Math.max(0, (Date.now() - ms) / 1000);
      if (s < 60)    return 'just now';
      if (s < 3600)  return Math.floor(s / 60) + 'm ago';   // rounds down, like the cards
      if (s < 86400) return Math.floor(s / 3600) + 'h ago';
      return Math.floor(s / 86400) + 'd ago';
    }

    // Formatting options that respect CONFIG.TIME_ZONE.
    const tz = CONFIG.TIME_ZONE ? { timeZone: CONFIG.TIME_ZONE } : {};

    // A notification's time, the way iOS writes it:
    //   now · 12m ago · 2h ago · then the clock time, e.g. 14:43
    // (The day heading above the card already says which day.)
    const hhmm = new Intl.DateTimeFormat('en-NZ', { ...tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
    function notificationTime(ms) {
      const skin = currentSkin();
      if (skin === 'marshmallow') return clockTime(ms).toUpperCase();
      if (skin === 'wp' || skin === 'webos') return clockTime(ms).toLowerCase();
      const mins = Math.floor(Math.max(0, Date.now() - ms) / 60000);
      if (mins < 1)  return 'now';
      if (materialSkin() || skin === 'nougat') {   // Android's short form: "12m", "3h"
        if (mins < 60) return mins + 'm';
        if (mins < 4 * 60) return Math.floor(mins / 60) + 'h';
        return hhmm.format(ms);
      }
      if (mins < 60) return mins + 'm ago';
      if (mins < 4 * 60) return Math.floor(mins / 60) + 'h ago';
      return hhmm.format(ms);
    }

    // "8:32 am" (or "8:32:40 am" with seconds)
    function clockTime(ms, withSeconds) {
      return new Date(ms).toLocaleTimeString(undefined, {
        ...tz, hour: 'numeric', minute: '2-digit', ...(withSeconds ? { second: '2-digit' } : {}),
      });
    }

    // The hover text for a card, for comparing who pushed first:
    //   NZ Herald
    //   Mon 19 Oct 2026, 8:32:13.482 am NZDT
    //   Repeated 2× (last at 8:35:01 am)
    // (en-NZ so the zone reads "NZDT" rather than "GMT+13".)
    const fullFormat = new Intl.DateTimeFormat('en-NZ', {
      ...tz, weekday: 'short', day: 'numeric', month: 'short', year: 'numeric',
      hour: 'numeric', minute: '2-digit', second: '2-digit',
      fractionalSecondDigits: 3, timeZoneName: 'short',
    });
    function fullTime(item) {
      let s = item.app + '\n' + fullFormat.format(item.time);
      if (item.repeats.length) {
        const last = item.repeats[item.repeats.length - 1];
        s += `\nRepeated ${item.repeats.length}× (last at ${clockTime(last, true)}), hidden`;
      }
      return s;
    }

    // "2026-10-19": which calendar day a moment falls on, in the chosen time
    // zone. Used to group cards under day headings.
    const dayKeyFormat = new Intl.DateTimeFormat('en-CA', { ...tz, year: 'numeric', month: '2-digit', day: '2-digit' });
    function dayKey(ms) { return dayKeyFormat.format(ms); }

    // "Today", "Yesterday", or "Sat 17 Oct"
    function dayLabel(ms) {
      const key = dayKey(ms);
      if (key === dayKey(Date.now())) return 'Today';
      if (key === dayKey(Date.now() - 86400000)) return 'Yesterday';
      return new Date(ms).toLocaleDateString(undefined, { ...tz, weekday: 'short', day: 'numeric', month: 'short' });
    }

    /* ════════════════════════════════════════════════════════════════════
       LOOK HELPERS
       ════════════════════════════════════════════════════════════════════ */
    // "NZ Herald" → "NH", "RNZ" → "R", "1News" → "1"
    function initials(name) {
      return name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
    }

    // Gives each app its own steady colour: the app's name is turned into a
    // number, and that number picks a hue on the colour wheel. Same app →
    // same colour, every visit, with no list to maintain.
    function colourFor(key) {
      let hash = 0;
      for (const ch of key) hash = (hash * 31 + ch.codePointAt(0)) >>> 0;
      return `hsl(${hash % 360} 52% 42%)`;
    }

    /* ════════════════════════════════════════════════════════════════════
       WALLPAPER SLIDESHOW
       When switched on, every SLIDESHOW_SECONDS a different random
       wallpaper is downloaded, put on the hidden layer and faded in. It
       pauses while the tab is hidden, and the on/off choice is saved in
       this browser only (if the browser allows saving).
       ════════════════════════════════════════════════════════════════════ */
    const slideshow = {
      walls: window.PUSH_FEED_WALLPAPERS || { folder: '', list: [], current: '' },
      layers: [document.getElementById('wall-a'), document.getElementById('wall-b')],
      showing: 0,          // which layer is currently visible
      timer: null,
      button: document.getElementById('slideshow-toggle'),
      check: document.getElementById('fade-check'),   // the display-mode switch
    };
    document.documentElement.style.setProperty('--wall-fade', CONFIG.SLIDESHOW_FADE_SECONDS + 's');

    // Material You's dynamic colour: the theme's seed hue comes from the
    // wallpaper (same-origin, so a canvas can read it). Each pixel's OKLab
    // colour is averaged, weighted by how colourful it is, so the main vivid
    // colour wins over greys and blacks. Sets --m-hue, which every Material
    // tone is built from; other themes ignore it.
    function applyWallpaperHue(img) {
      try {
        const size = 24;
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, size, size);
        const px = ctx.getImageData(0, 0, size, size).data;
        const lin = v => (v /= 255) <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
        let sumA = 0, sumB = 0;
        for (let i = 0; i < px.length; i += 4) {
          const r = lin(px[i]), g = lin(px[i + 1]), b = lin(px[i + 2]);
          const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
          const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
          const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
          const a  = 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s;
          const bb = 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s;
          const weight = Math.hypot(a, bb);
          sumA += a * weight;
          sumB += bb * weight;
        }
        if (Math.hypot(sumA, sumB) < 1e-6) return;   // a grey wallpaper: keep the default
        const hue = (Math.atan2(sumB, sumA) * 180 / Math.PI + 360) % 360;
        document.documentElement.style.setProperty('--m-hue', hue.toFixed(1));
      } catch (e) { /* unreadable image: keep the default hue */ }
    }
    if (slideshow.walls.current) {
      const first = new Image();
      first.onload = () => applyWallpaperHue(first);
      first.src = slideshow.walls.folder + slideshow.walls.current;
    }

    function slideshowOn() { return slideshow.button.getAttribute('aria-pressed') === 'true'; }

    function setSlideshow(on) {
      slideshow.button.setAttribute('aria-pressed', String(on));
      slideshow.check.checked = on;
      try { localStorage.setItem('pushFeedSlideshow', on ? 'on' : 'off'); } catch (e) { /* not saved; fine */ }
      scheduleWallpaper();
    }

    function scheduleWallpaper() {
      clearTimeout(slideshow.timer);
      if (!slideshowOn() || document.hidden || slideshow.walls.list.length < 2) return;
      slideshow.timer = setTimeout(nextWallpaper, CONFIG.SLIDESHOW_SECONDS * 1000);
    }

    function nextWallpaper() {
      const others = slideshow.walls.list.filter(name => name !== slideshow.walls.current);
      const name = others[Math.floor(Math.random() * others.length)];
      const url = slideshow.walls.folder + name;

      // Download it first, so the fade never shows a half-loaded image.
      const img = new Image();
      img.onload = () => {
        const incoming = slideshow.layers[1 - slideshow.showing];
        const outgoing = slideshow.layers[slideshow.showing];
        incoming.style.backgroundImage = `url("${url}")`;
        incoming.classList.add('is-showing');
        outgoing.classList.remove('is-showing');
        slideshow.showing = 1 - slideshow.showing;
        slideshow.walls.current = name;
        document.documentElement.style.setProperty('--wallpaper', `url("${url}")`);
        applyWallpaperHue(img);
        scheduleWallpaper();
      };
      img.onerror = scheduleWallpaper; // skip a missing file, try another next time
      img.src = url;
    }

    slideshow.button.addEventListener('click', () => setSlideshow(!slideshowOn()));
    slideshow.check.addEventListener('change', () => setSlideshow(slideshow.check.checked));
    document.addEventListener('visibilitychange', scheduleWallpaper);
    try { if (localStorage.getItem('pushFeedSlideshow') === 'on') setSlideshow(true); } catch (e) { /* ignore */ }

    /* ════════════════════════════════════════════════════════════════════
       THEME SLIDER: iOS, Material, Nougat, Marshmallow, Windows Phone and
       Palm webOS. Saved in this browser; ?skin=ios|material|nougat|marshmallow|wp|webos
       overrides it on load (see the script in <head>).
       ════════════════════════════════════════════════════════════════════ */
    const THEMES = ['ios', 'material', 'nougat', 'marshmallow', 'wp', 'webos'];
    const THEME_NAMES = { ios: 'iOS', material: 'Material', nougat: 'Nougat', marshmallow: 'Marshmallow', wp: 'Windows Phone', webos: 'Palm webOS' };
    const WP_ACCENTS = [
      { id: 'cyan',    colour: '#1ba1e2' },
      { id: 'cobalt',  colour: '#0050ef' },
      { id: 'magenta', colour: '#d80073' },
      { id: 'lime',    colour: '#a4c400' },
      { id: 'orange',  colour: '#fa6800' },
      { id: 'emerald', colour: '#008a00' },
      { id: 'violet',  colour: '#aa00ff' },
      { id: 'crimson', colour: '#a20025' },
    ];
    let wpAccentIndex = 0;
    try {
      const savedAccent = localStorage.getItem('pushFeedWpAccent');
      const idx = WP_ACCENTS.findIndex(a => a.id === savedAccent);
      if (idx >= 0) wpAccentIndex = idx;
    } catch (e) { /* fine */ }
    let wpEnterMode = 'turnstile';
    let wpBusyTimer = null;
    let wpBusyMinUntil = 0;

    function pulseWpBusy(on, minMs = 0) {
      clearTimeout(wpBusyTimer);
      if (on) {
        wpBusyMinUntil = Math.max(wpBusyMinUntil, Date.now() + minMs);
        document.documentElement.classList.add('wp-busy');
        if (minMs > 0) {
          wpBusyTimer = setTimeout(() => {
            if (Date.now() >= wpBusyMinUntil) document.documentElement.classList.remove('wp-busy');
          }, minMs);
        }
      } else {
        const wait = Math.max(0, wpBusyMinUntil - Date.now());
        wpBusyTimer = setTimeout(() => document.documentElement.classList.remove('wp-busy'), wait);
      }
    }

    const wpQuickActions = document.getElementById('wp-quick-actions');
    function syncWpQuickActions() {
      const accent = WP_ACCENTS[wpAccentIndex];
      document.documentElement.style.setProperty('--wp-accent', accent.colour);
      const isLight = document.documentElement.classList.contains('wp-light');
      document.getElementById('wp-accent-label').textContent = accent.id;
      document.getElementById('wp-bg-label').textContent = isLight ? 'light' : 'dark';
      const bgBtn = wpQuickActions.querySelector('[data-wp-action="bg"]');
      bgBtn.setAttribute('aria-pressed', String(isLight));
      syncWpExpandTile();
    }
    function syncWpExpandTile() {
      const cards = [...el.feed.querySelectorAll('.wp-item')];
      const allOpen = cards.length > 0 && cards.every(c => c.classList.contains('l-open'));
      const btn = wpQuickActions.querySelector('[data-wp-action="expand"]');
      btn.setAttribute('aria-pressed', String(allOpen));
      document.getElementById('wp-expand-label').textContent = allOpen ? 'collapse' : 'expand';
    }

    wpQuickActions.addEventListener('click', event => {
      const btn = event.target.closest('.wp-qa');
      if (!btn) return;
      const action = btn.dataset.wpAction;
      if (action === 'refresh') {
        btn.classList.remove('is-spinning');
        void btn.offsetWidth;
        btn.classList.add('is-spinning');
        setTimeout(() => btn.classList.remove('is-spinning'), 700);
        pulseWpBusy(true, 1200);
        toast('checking feed…');
        refresh();
      } else if (action === 'accent') {
        wpAccentIndex = (wpAccentIndex + 1) % WP_ACCENTS.length;
        try { localStorage.setItem('pushFeedWpAccent', WP_ACCENTS[wpAccentIndex].id); } catch (e) { /* fine */ }
        syncWpQuickActions();
        toast('accent · ' + WP_ACCENTS[wpAccentIndex].id);
      } else if (action === 'bg') {
        const isLight = document.documentElement.classList.toggle('wp-light');
        try { localStorage.setItem('pushFeedWpLight', isLight ? 'light' : 'dark'); } catch (e) { /* fine */ }
        syncTheme();
        syncWpQuickActions();
        toast(isLight ? 'light background' : 'dark background');
      } else if (action === 'expand') {
        const cards = [...el.feed.querySelectorAll('.wp-item')];
        if (!cards.length) return;
        const openAll = !cards.every(c => c.classList.contains('l-open'));
        for (const card of cards) {
          card.classList.toggle('l-open', openAll);
          const id = card.closest('.stack')?.dataset.id;
          if (id) { if (openAll) expandedIds.add(id); else expandedIds.delete(id); }
          const expBtn = card.querySelector('.l-expand');
          if (expBtn) expBtn.setAttribute('aria-expanded', String(openAll));
        }
        syncWpExpandTile();
      }
    });

    // Pointer-aware Metro 3D TiltEffect on press for tiles, items & buttons.
    let activeTilt = null;
    function clearTilt() {
      if (!activeTilt) return;
      activeTilt.classList.remove('wp-tilt');
      activeTilt = null;
    }
    document.addEventListener('pointerdown', event => {
      if (currentSkin() !== 'wp' || reducedMotion.matches) return;
      if (event.target.closest('.when')) return;
      const target = event.target.closest('.wp-item, .wp-qa, .tabs button, .l-acts button');
      if (!target) return;
      const rect = target.getBoundingClientRect();
      const nx = Math.max(-1, Math.min(1, ((event.clientX - rect.left) / Math.max(1, rect.width) - 0.5) * 2));
      const ny = Math.max(-1, Math.min(1, ((event.clientY - rect.top) / Math.max(1, rect.height) - 0.5) * 2));
      const strength = target.classList.contains('wp-item') ? 3.5 : 8;
      target.style.setProperty('--wp-rx', (-ny * strength).toFixed(2) + 'deg');
      target.style.setProperty('--wp-ry', (nx * strength).toFixed(2) + 'deg');
      clearTilt();
      target.classList.add('wp-tilt');
      activeTilt = target;
    }, { passive: true });
    window.addEventListener('pointerup', clearTilt, { passive: true });
    window.addEventListener('pointercancel', clearTilt, { passive: true });

    const webosTicker = {
      root: document.getElementById('webos-ticker'),
      glyph: document.getElementById('webos-ticker-glyph'),
      app: document.getElementById('webos-ticker-app'),
      msg: document.getElementById('webos-ticker-msg'),
      close: document.getElementById('webos-ticker-close'),
      gesture: document.getElementById('webos-gesture'),
      timer: null,
    };
    function hideWebosTicker() {
      clearTimeout(webosTicker.timer);
      webosTicker.root.classList.remove('is-open');
      webosTicker.gesture.classList.remove('is-pulsing');
    }
    function showWebosTicker(item) {
      if (!item || currentSkin() !== 'webos') return;
      webosTicker.glyph.replaceChildren(webosGlyph(item));
      webosTicker.app.textContent = item.byline || item.app;
      webosTicker.msg.textContent = item.headline;
      webosTicker.root.classList.add('is-open');
      webosTicker.gesture.classList.remove('is-pulsing');
      void webosTicker.gesture.offsetWidth;
      webosTicker.gesture.classList.add('is-pulsing');
      clearTimeout(webosTicker.timer);
      webosTicker.timer = setTimeout(hideWebosTicker, 4800);
    }
    webosTicker.close.addEventListener('click', hideWebosTicker);
    webosTicker.gesture.addEventListener('click', () => {
      if (webosTicker.root.classList.contains('is-open')) hideWebosTicker();
      else {
        const latest = tabItems()[0] || items[0];
        if (latest) showWebosTicker(latest);
      }
    });

    const themeSlider = document.querySelector('.theme-slider');
    function currentSkin() {
      if (displayMode) return 'ios';
      return THEMES.find(theme => document.documentElement.classList.contains('skin-' + theme)) || 'ios';
    }
    function syncTheme() {
      const theme = currentSkin();
      const wpLight = theme === 'wp' && document.documentElement.classList.contains('wp-light');
      themeSlider.setAttribute('aria-label', 'Theme: ' + THEME_NAMES[theme]);
      themeSlider.style.setProperty('--theme-index', THEMES.indexOf(theme));
      themeSlider.querySelector('input[value="' + theme + '"]').checked = true;
      document.querySelector('meta[name="theme-color"]').content =
        ({ ios: '#000000', material: '#121316', nougat: '#e0e0e0', marshmallow: '#37474f', wp: wpLight ? '#ffffff' : '#000000', webos: '#000000' })[theme];
      document.querySelector('meta[name="color-scheme"]').content =
        (theme === 'nougat' || theme === 'marshmallow' || wpLight) ? 'light' : 'dark';
    }
    themeSlider.addEventListener('change', event => {
      const theme = event.target.value;
      if (!THEMES.includes(theme)) return;
      document.documentElement.classList.remove(...THEMES.map(name => 'skin-' + name));
      if (theme !== 'ios') document.documentElement.classList.add('skin-' + theme);
      try { localStorage.setItem('pushFeedSkin', theme); } catch (e) { /* fine */ }
      const url = new URL(location.href);
      if (url.searchParams.has('skin')) {
        url.searchParams.set('skin', theme);
        history.replaceState(null, '', url);
      }
      if (theme === 'wp') {
        wpEnterMode = 'turnstile';
        wpQuickActions.classList.remove('wp-qa-enter');
        void wpQuickActions.offsetWidth;
        wpQuickActions.classList.add('wp-qa-enter');
        pulseWpBusy(true, 1300);
      }
      if (theme !== 'webos') hideWebosTicker();
      syncTheme();
      syncWpQuickActions();
      syncFeedBar();
      render();
      if (theme === 'webos') {
        const latest = tabItems()[0] || items[0];
        if (latest) showWebosTicker(latest);
      }
      toast(THEME_NAMES[theme] + ' theme');   // swatch names are hover-only, so say it on touch screens too
    });
    syncTheme();
    syncWpQuickActions();
    if (currentSkin() === 'wp') wpQuickActions.classList.add('wp-qa-enter');

    /* ════════════════════════════════════════════════════════════════════
       START
       ════════════════════════════════════════════════════════════════════ */
    // Re-draw as the visitor types or picks a publisher (no download needed).
    el.search.addEventListener('input', render);
    el.appFilter.addEventListener('change', render);
    /* Feed switcher for the Nougat / Marshmallow themes. */
    const feedBar = {
      root: document.querySelector('.legacy-bar'),
      toggle: document.querySelector('.feed-switch'),
      name: document.querySelector('.feed-name'),
      count: document.querySelector('.feed-count'),
      menu: document.querySelector('.feed-menu'),
      searchBtn: document.querySelector('.feed-search-btn'),
    };
    function tabCount(button) { return button.querySelector('.count')?.textContent || ''; }
    function syncFeedBar() {
      const sideLabel = CONFIG.SIDE_TAB ? CONFIG.SIDE_TAB.label : '';
      const name = onSideTab ? sideLabel : 'News';
      feedBar.name.textContent = name;
      feedBar.count.textContent = tabCount(onSideTab ? el.tabSide : el.tabNews);
      feedBar.root.classList.toggle('no-feeds', !CONFIG.SIDE_TAB);
      const [news, side] = feedBar.menu.children;
      news.replaceChildren('News', make('span', 'count', tabCount(el.tabNews)));
      side.replaceChildren(sideLabel, make('span', 'count', tabCount(el.tabSide)));
      news.setAttribute('aria-checked', String(!onSideTab));
      side.setAttribute('aria-checked', String(onSideTab));
      el.search.placeholder =
        currentSkin() === 'marshmallow' ? 'Search ' + name :
        currentSkin() === 'wp' ? 'search alerts' :
        currentSkin() === 'webos' ? 'Just type to filter…' :
        'Search alerts…';
    }
    function openFeedMenu(open) {
      feedBar.menu.hidden = !open;
      feedBar.toggle.setAttribute('aria-expanded', String(open));
      if (open) feedBar.menu.querySelector('[aria-checked="true"]').focus();
    }
    feedBar.toggle.addEventListener('click', event => {
      event.stopPropagation();
      if (!CONFIG.SIDE_TAB) return;
      openFeedMenu(feedBar.menu.hidden);
    });
    feedBar.menu.addEventListener('click', event => {
      const item = event.target.closest('button');
      if (!item) return;
      (item.dataset.side === 'true' ? el.tabSide : el.tabNews).click();
      openFeedMenu(false);
      feedBar.toggle.focus();
    });
    document.addEventListener('click', event => {
      if (!feedBar.menu.hidden && !feedBar.root.contains(event.target)) openFeedMenu(false);
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !feedBar.menu.hidden) { openFeedMenu(false); feedBar.toggle.focus(); }
    });
    // Nougat: search hides behind the icon until it's tapped (or in use).
    feedBar.searchBtn.addEventListener('click', () => {
      const open = !document.getElementById('toolbar').classList.contains('is-searching');
      document.getElementById('toolbar').classList.toggle('is-searching', open);
      feedBar.searchBtn.setAttribute('aria-expanded', String(open));
      if (open) el.search.focus();
    });

    el.tabNews.addEventListener('click', () => switchTab(false));
    el.tabSide.addEventListener('click', () => switchTab(true));

    // Give the toolbar its frosted backing only while it's pinned to the
    // top: an invisible marker just above it scrolls out of view exactly then.
    new IntersectionObserver(([entry]) => {
      document.getElementById('toolbar').classList.toggle('is-stuck', !entry.isIntersecting);
    }).observe(document.getElementById('toolbar-sentinel'));
    window.addEventListener('hashchange', () => switchTab(!!CONFIG.SIDE_TAB && location.hash === '#side'));

    if (!CONFIG.SIDE_TAB) onSideTab = false;
    updateTabs();

    if (displayMode) {
      onSideTab = false;
      for (const button of document.querySelectorAll('#mode-toggle button')) {
        button.addEventListener('click', () => setDisplayLayout(button.dataset.layout));
      }
      // ?display=hero picks the layout; plain ?display uses the last one
      // chosen on this screen.
      let saved = null;
      try { saved = localStorage.getItem('pushFeedDisplay'); } catch (e) { /* fine */ }

      // Takeover (Simple layout): on if the address has &takeover, otherwise
      // whatever was last chosen on this screen.
      const takeoverCheck = document.getElementById('takeover-check');
      let savedTakeover = null;
      try { savedTakeover = localStorage.getItem('pushFeedTakeover'); } catch (e) { /* fine */ }
      const takeoverParam = new URLSearchParams(location.search).has('takeover');
      takeoverCheck.checked = takeoverParam || savedTakeover === 'on';
      // The address is tidied to ?display=… below, so remember a &takeover
      // choice or a reload would lose it.
      if (takeoverParam) { try { localStorage.setItem('pushFeedTakeover', 'on'); } catch (e) { /* fine */ } }
      takeoverCheck.addEventListener('change', () => {
        try { localStorage.setItem('pushFeedTakeover', takeoverCheck.checked ? 'on' : 'off'); } catch (e) { /* fine */ }
      });

      // Fade (wallpaper slideshow): &fade in the address switches it on and,
      // like the round button, it's remembered on this screen.
      if (new URLSearchParams(location.search).has('fade')) setSlideshow(true);

      setDisplayLayout(new URLSearchParams(location.search).get('display') || saved || 'simple');

      // Card heights change when the web fonts finish loading or the screen
      // size changes, so re-check what fits then.
      if (document.fonts) document.fonts.ready.then(render);
      tickDisplayClock();
      window.addEventListener('resize', render);

      // Hide the mouse pointer after 3 still seconds; moving it brings it back.
      let cursorTimer;
      const showCursor = () => {
        document.body.classList.remove('hide-cursor');
        clearTimeout(cursorTimer);
        cursorTimer = setTimeout(() => document.body.classList.add('hide-cursor'), 3000);
      };
      document.addEventListener('mousemove', showCursor);
      showCursor();
    }

    setInterval(tickClock, 30000);
    refresh(); // first download straight away
  })();
  </script>
</body>
</html>
